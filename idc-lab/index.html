{id:'PWR-05',group:'power',title:'柴油发电机选型与燃油',diff:'中级',type:'柴发',desc:'模拟关键负载与燃油储备，选择满足基本容量要求的柴油发电机。',brief:'关键负载240kW、运行功率因数0.8，容量基准300kVA。另需考虑电动机启动及阶跃负载，本关设模拟选型裕量20%；燃油按照70L/h估计。',initial:{genkva:250,fuel:140,hours:4},controls:[C('genkva','候选柴发额定容量',{'250':'250 kVA','350':'350 kVA','400':'400 kVA','500':'500 kVA'}),R('fuel','有效燃油容量',100,700,20,' L'),R('hours','期望供电时间',2,10,1,' h')],checks:[K('机组容量满足本关初步要求',s=>+s.genkva>=360,'300kVA×1.2=360kVA，至少选400kVA'),K('燃油可维持预期运行',s=>s.fuel/70>=s.hours,'续航≈有效油量÷70L/h'),K('记录燃油容量估算边界',s=>s.hours>=4,'燃油消耗与负荷相关，本关设4小时及以上')]},

function motorI(){return 22000/(Math.sqrt(3)*400*.92*.85)}function mccVD(mm){return Math.sqrt(3)*motorI()*100*.0225/mm/400*100}function shortCircuitKA(){return 1000/(Math.sqrt(3)*.4*.06)/1000}function pfcNeed(){return 350*(Math.tan(Math.acos(.78))-Math.tan(Math.acos(.95)))}function relayTime(s){if(s.curve!=='si'||s.pickup>=5000)return 0;return .14*s.tms/(Math.pow(5000/s.pickup,.02)-1)}function inletTemp(s){return 37-(s.door?4:0)-(s.blank?5:0)-(s.air-50)*.19}function batteryMin(s){return s.voltage*s.ah*(s.eff/100)*(s.use/100)/(s.load*1000)*60}function syncOK(s){return Math.abs(s.voltage-400)<=20&&Math.abs(s.frequency-50)<=.2&&s.angle<=10}function redundantAlive(s){return s.a==='on'||s.b==='on'}
const LS='zhiwei-lab-cn-v1';let state={nav:'home',level:null,attempts:{},progress:{},view:0};try{let saved=JSON.parse(localStorage.getItem(LS)||'{}');state.attempts=saved.attempts||{};state.progress=saved.progress||{}}catch(e){}let result=null;let logs=[];
function store(){try{localStorage.setItem(LS,JSON.stringify({attempts:state.attempts,progress:state.progress}))}catch(e){}}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function current(){return LEVELS.find(x=>x.id===state.level)}function lessonState(l){if(!state.attempts[l.id])state.attempts[l.id]=structuredClone(l.initial);return state.attempts[l.id]}function passed(){return LEVELS.filter(l=>state.progress[l.id]).length}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window._toastTimeout);window._toastTimeout=setTimeout(()=>el.classList.add('hidden'),3000)}function nav(n){state.nav=n;state.level=null;result=null;render()}function openLevel(id){const l=LEVELS.find(x=>x.id===id);if(!l)return;state.nav=l.group;state.level=id;state.view=0;result=null;logs=[];lessonState(l);render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.nav));document.getElementById('sidebar-progress').style.width=passed()/LEVELS.length*100+'%';document.getElementById('sidebar-progress-text').textContent=passed()+'/24 已通过';document.getElementById('breadcrumb').innerHTML='实训中心 / <b>'+safe(state.level?(GROUPS[state.nav].name+' / '+state.level):(state.nav==='home'?'首页':GROUPS[state.nav].name))+'</b>'}
function render(){renderNav();document.getElementById('screen').innerHTML=state.level?renderWorkspace(current()):renderLibrary();bindControls()}
function renderLibrary(){const groups=state.nav==='home'?Object.keys(GROUPS):[state.nav];const cnt=passed();return (state.nav==='home'?`<div class="eyebrow">OPERATIONS TRAINING · V1.0</div><h1 class="headline">数据中心智能运维实训台</h1><p class="subline">按工单完成任务，观察设备与数值变化，执行自动验收。24个中文可操作关卡，围绕数据中心、低压MCC及关键电源系统。</p><div class="hero"><div><strong>从识读系统，到独立排除故障。</strong><p>每一次点击都对应模拟设备状态，每一次验收都给出检查结果。<br/>离线工作 · 自动留存本机进度</p></div><div style="text-align:center"><div class="hero-stat">${cnt}/24</div><small style="color:#8bb0bc">关卡已通过</small></div></div><div class="stats"><div class="stat"><span>总实训关卡</span><strong>24</strong></div><div class="stat"><span>数据中心</span><strong>${countPassed('dc')}/8</strong></div><div class="stat"><span>MCC 配电</span><strong>${countPassed('mcc')}/8</strong></div><div class="stat"><span>UPS / 柴发</span><strong>${countPassed('power')}/8</strong></div></div>`:`<div class="eyebrow">${safe(GROUPS[state.nav].tag)}</div><h1 class="headline">${safe(GROUPS[state.nav].name)}</h1><p class="subline">${safe(GROUPS[state.nav].desc)}<br/>点击关卡进入中文互动操作台。</p>`)+groups.map(g=>`<div class="group-title"><h2>${GROUPS[g].icon} &nbsp;${GROUPS[g].name}</h2><span>8个关卡 · 通过 ${countPassed(g)}/8</span></div><div class="level-grid">${LEVELS.filter(l=>l.group===g).map(l=>`<article class="level-card" role="button" tabindex="0" data-level="${l.id}"><div class="code">${l.id} <span class="status ${state.progress[l.id]?'done':''}">${state.progress[l.id]?'✓ 已通过':'尚未通过'}</span></div><h3>${safe(l.title)}</h3><p>${safe(l.desc)}</p><footer><span>${l.diff} · ${l.type}</span><em>进入实训 →</em></footer></article>`).join('')}</div>`).join('')}
function countPassed(g){return LEVELS.filter(l=>l.group===g&&state.progress[l.id]).length}
function controlHtml(c,s){const val=s[c.key];if(c.type==='choice')return `<div class="control"><div class="control-label">${safe(c.label)}</div><div class="buttons">${Object.entries(c.options).map(([k,v])=>`<button class="choice ${String(val)===k?'sel':''}" data-key="${c.key}" data-value="${safe(k)}">${safe(v)}</button>`).join('')}</div></div>`;if(c.type==='toggle')return `<div class="control"><div class="control-label">${safe(c.label)}<b>${val?'已完成':'待操作'}</b></div><div class="buttons"><button class="choice ${val?'sel':''}" data-key="${c.key}" data-value="${!val}">${val?'✓ 已确认（点击撤销）':'执行 / 确认'}</button></div></div>`;if(c.type==='range')return `<div class="control"><div class="control-label">${safe(c.label)}<b>${(+val).toFixed(Number.isInteger(c.step)?0:((String(c.step).split('.')[1]||'').length))}${safe(c.unit)}</b></div><input data-range="${c.key}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${val}" aria-label="${safe(c.label)}"/></div>`;if(c.type==='steps')return `<div class="control"><div class="control-label">${safe(c.label)}<b>${val}/${c.steps.length}</b></div><div class="bar"><i style="width:${val/c.steps.length*100}%"></i></div><div class="step-current">下一步：<b>${safe(c.steps[val]||'全部流程完成')}</b></div><div style="margin-top:12px">${c.steps.map((step,i)=>`<button class="choice step-btn ${i<val?'sel':''}" data-step="${i}" ${i<val?'disabled':''}>${i<val?'✓':i+1+'.'} ${safe(step)}</button>`).join('')}</div></div>`;return ''}
function renderWorkspace(l){const s=lessonState(l);const evals=l.checks.map(c=>({ok:!!c.fn(s),label:c.label,hint:c.hint}));const done=evals.filter(x=>x.ok).length;const total=evals.length;const logPanel=logs.slice(-5).reverse();return `<div class="work-head"><div><div class="eyebrow">${l.id} · ${l.type} · ${l.diff}</div><h1>${safe(l.title)}</h1><span class="pill">${safe(GROUPS[l.group].name)} · ${state.progress[l.id]?'已通过':'实训中'}</span></div><div class="mode-tabs"><button class="mini-btn" data-navto="${l.group}">← 返回关卡</button><button class="mini-btn" id="next-level">下一关 →</button></div></div><div class="workspace"><div><section class="panel"><div class="panel-head"><h2>◉ 场景操作与实时状态</h2><span class="hint-label">可调整控制项 · 参数即时联动</span></div><div class="viewport"><div class="scene-container" id="scene-container">${sceneSvg(l,s)}</div><div class="scene-meta">${safe(l.id)} | 模拟运行环境<br/>设备组：<b>${safe(l.group==='dc'?'AI机柜区':l.group==='mcc'?'低压配电室':'关键电源室')}</b></div><div class="scene-tools"><button id="rotate">⟳ 切换视角</button><button id="details">◎ 读数说明</button></div></div>${meters(l,s)}</section><section class="panel" style="margin-top:15px"><div class="panel-head"><h2>◫ 技术计算与状态分析</h2><span class="hint-label">跟随操作自动更新</span></div><div style="padding:14px 18px">${calcs(l,s)}</div></section><section class="panel" style="margin-top:15px"><div class="panel-head"><h2>▧ 操作记录</h2><span class="hint-label">本次打开关卡的实时记录</span></div><div class="log">${logPanel.length?logPanel.map(x=>`<div class="log-line">${safe(x)}</div>`).join(''):'<p style="font-size:12px;color:#819cb2">尚无操作。请在右侧控制台开始。</p>'}</div></section></div><div><section class="panel"><div class="ticket"><div class="tickethead"><span>WORK ORDER · ${l.id}</span><span>培训专用</span></div><h3>任务：${safe(l.title)}</h3><p>${safe(l.brief)}</p></div><div class="controls"><h3>操作控制台</h3>${l.controls.map(c=>controlHtml(c,s)).join('')}</div><div class="checks"><h3>验收项目 · ${done}/${total}</h3>${evals.map(x=>`<div class="check-row ${x.ok?'good':'bad'}"><span>${x.ok?'✓':'○'}</span><span>${safe(x.label)}${x.ok?'':`<small>${safe(x.hint)}</small>`}</span></div>`).join('')}</div>${result?`<div class="result ${result.success?'success':'fail'}">${result.success?'✓ 自动验收通过！成绩已保存，可进入下一关。':'有 '+(total-done)+' 项未通过，请按提示修正后重新验收。'}</div>`:''}<div class="actions"><button class="primary" id="accept">✓ 执行自动验收</button><button class="secondary" id="reset">重置</button></div></section></div></div><div class="note">⚠ 本产品属于原创教学仿真，所有操作仅改变模拟状态。高压、LOTO、验电、并机等步骤不是可直接用于现场的操作票。</div>`}
function meters(l,s){let items=[];if(l.group==='dc'){items=[['机柜平均负载',l.id==='DC-03'?(s.servers*s.kw).toFixed(1)+'kW':'18.0kW','ok'],['A路供电',s.feed==='aoff'?'失电':s.a===false?'未连接':'正常',s.feed==='aoff'?'bad':'ok'],['B路供电',s.feed==='boff'?'失电':s.b===false?'未连接':'正常',s.feed==='boff'?'bad':'ok'],['冷通道进风',l.id==='DC-04'?inletTemp(s).toFixed(1)+'℃':'23.5℃',l.id==='DC-04'&&inletTemp(s)>27?'bad':'ok']]}else if(l.group==='mcc'){items=[['变压器','11/0.4kV','ok'],['母线电压','400V','ok'],['电机额定电流',motorI().toFixed(1)+'A','ok'],['断路器状态',l.id==='MCC-02'&&s.progress>=3?'断开':'模拟合位',l.id==='MCC-02'&&s.progress>=3?'warn':'ok']]}else{let source=l.id==='PWR-04'?(s.ats==='gen'?'柴油发电机':'市电'):'双变换UPS';items=[['当前电源',source,'ok'],['关键负载',l.id==='PWR-02'?'180 kW':'80 kW','ok'],['UPS输出','400V','ok'],['备用状态',l.id==='PWR-06'&&s.closed?'已并机':l.id==='PWR-07'?redundantAlive(s)?'可供电':'双路失电':'就绪',l.id==='PWR-07'&&!redundantAlive(s)?'bad':'ok']]};return `<div class="telemetry">${items.map(i=>`<div class="meter ${i[2]}"><b>${safe(i[1])}</b><span>${safe(i[0])}</span></div>`).join('')}</div>`}
function calcs(l,s){const entries=[];switch(l.id){case'DC-03':entries.push(['服务器总负载',(s.servers*s.kw).toFixed(1)+' kW'],['单路规划上限','25.6 kW'],['单路故障后承载',s.balance==='dual'?(s.servers*s.kw).toFixed(1)+' kW':'不满足双路'],['冗余判定',s.balance==='dual'&&s.servers*s.kw<=25.6?'满足模拟容量':'检查供电配置']);break;case'DC-04':entries.push(['B区服务器进风',inletTemp(s).toFixed(1)+' ℃'],['模拟允许范围','18–27 ℃'],['送风比例',s.air+'%'],['封闭气流',s.door&&s.blank?'完成':'未完成']);break;case'DC-05':entries.push(['总设施月耗电','1,500,000 kWh'],['IT设备月耗电','1,000,000 kWh'],['计算PUE','1.50'],['当前填报',(+s.pue).toFixed(2)]);break;case'MCC-03':entries.push(['电机估算额定电流',motorI().toFixed(1)+' A'],['简化线路压降',mccVD(s.cable).toFixed(2)+' %'],['电缆',s.cable+' mm²'],['保护整定',s.overload+' A']);break;case'MCC-04':entries.push(['星接运行',s.time+' 秒'],['先断后合',s.gap+' 秒'],['过载设定',s.overload+' A'],['启动结果',s.test?(s.time>=5&&s.gap>=.1?'完成':'参数待调'):'未启动']);break;case'MCC-05':entries.push(['下级动作时间','0.42 s'],['级差要求','≥0.25 s'],['上级计算动作',relayTime(s)?relayTime(s).toFixed(2)+' s':'未设定'],['时间裕量',relayTime(s)?(relayTime(s)-.42).toFixed(2)+' s':'—']);break;case'MCC-06':entries.push(['变压器','1000 kVA'],['阻抗电压','6 %'],['计算短路电流',shortCircuitKA().toFixed(2)+' kA'],['选择Icu',s.icu?s.icu+' kA':'待选']);break;case'MCC-07':entries.push(['现有功率因数','0.78'],['目标功率因数','0.95'],['需要补偿',pfcNeed().toFixed(1)+' kvar'],['计划补偿',s.bank+' kvar']);break;case'PWR-02':entries.push(['基础需要容量',(180/.9).toFixed(0)+' kVA'],['含余量', (180/.9*(1+s.margin/100)).toFixed(0)+' kVA'],['单模块容量','60 kVA'],['N+1可用容量',(Math.max(0,s.modules-1)*60)+' kVA']);break;case'PWR-03':entries.push(['电池组能量',(s.voltage*s.ah/1000).toFixed(1)+' kWh'],['有效电能',(s.voltage*s.ah*s.eff/100*s.use/100/1000).toFixed(1)+' kWh'],['估算续航',batteryMin(s).toFixed(1)+' 分钟'],['额定负载',s.load+' kW']);break;case'PWR-04':entries.push(['市电',s.utility==='on'?'正常':'失电'],['发电机',s.gen==='ready'?'合格':s.gen==='start'?'启动中':'停机'],['ATS位置',s.ats==='gen'?'发电机':'市电'],['负载是否供电',(s.ats==='utility'&&s.utility==='on')||(s.ats==='gen'&&s.gen==='ready')?'有电':'失电']);break;case'PWR-05':entries.push(['计算基准','300 kVA'],['含裕量目标','360 kVA'],['机组选型',s.genkva+' kVA'],['预计油料续航',(s.fuel/70).toFixed(1)+' 小时']);break;case'PWR-06':entries.push(['电压偏差',Math.abs(s.voltage-400).toFixed(1)+' V'],['频率差',Math.abs(s.frequency-50).toFixed(2)+' Hz'],['相位差',s.angle+'°'],['同期窗口',syncOK(s)?'允许模拟合闸':'不同期，闭锁']);break;case'PWR-07':entries.push(['A路',s.a==='on'?'正常':'断开'],['B路',s.b==='on'?'正常':'断开'],['IT负载',redundantAlive(s)?'在线':'失电'],['受影响负载','80 kW']);break;default:entries.push(['自动验收','按右侧逐项操作'],['本关关卡',l.id],['任务难度',l.diff],['专业分类',l.type])};return `<div class="calc">${entries.map(([k,v])=>`<div class="calc-item">${safe(k)}<b>${safe(v)}</b></div>`).join('')}</div>`}
function sceneSvg(l,s){let special=l.group==='dc'?'dc':l.group==='mcc'?'mcc':'power';let fill=(l.id==='PWR-07'&&!redundantAlive(s))||l.id==='PWR-04'&&(s.ats==='gen'&&s.gen!=='ready'||s.ats==='utility'&&s.utility==='off')?'#ff7e89':'#36dabc';let body='';if(special==='dc'){body=`<polygon points="40,150 440,82 750,159 352,258" fill="#18334b" stroke="#416482" stroke-width="2"/><polygon points="40,150 352,258 352,330 40,225" fill="#0c2337"/><polygon points="352,258 750,159 750,224 352,330" fill="#112b42"/>${[0,1,2,3,4].map(i=>{let x=112+i*111,y=160-i*16;return `<g data-device="机柜 R${i+1}" style="cursor:pointer" transform="translate(${x} ${y})"><polygon points="0,0 76,-14 97,-3 19,12" fill="#325269" stroke="#83a2b1"/><polygon points="19,12 97,-3 97,117 19,136" fill="#142b44" stroke="#86a8b5"/><polygon points="0,0 19,12 19,136 0,120" fill="#0b2138" stroke="#668fa0"/>${[0,1,2,3,4,5].map(j=>`<g><path d="M26 ${25+j*16} L89 ${9+j*16}" stroke="#3a6b88" stroke-width="9"/><path d="M26 ${25+j*16} L89 ${9+j*16}" stroke="${j===1?'#71cbff':'#74a4c3'}" stroke-width="1"/><circle cx="81" cy="${8+j*16}" r="2.3" fill="${j===1?'#ffc36b':'#34d9ad'}" class="${j===1?'blink':''}"/></g>`).join('')}<text x="29" y="130" font-size="12" fill="#8bd9e7">R${i+1}</text></g>`}).join('')}<path d="M62 241 L354 327 L704 240" stroke="#38d3db" stroke-width="4" stroke-dasharray="12 14" opacity=".6"/><text x="62" y="290" fill="#88cad9" font-size="15">冷通道 Cold Aisle</text><text x="520" y="66" fill="#ffc884" font-size="15">热通道 Hot Aisle</text>${l.id==='DC-04'?`<ellipse cx="530" cy="184" rx="80" ry="65" fill="${inletTemp(s)>27?'#ff694b':'#38cbb4'}" opacity=".17" class="blink"/>`:''}`}

else{let live=(l.id==='PWR-04'?(s.ats==='utility'&&s.utility==='on')||(s.ats==='gen'&&s.gen==='ready'):l.id==='PWR-07'?redundantAlive(s):true);body=`<polygon points="65,105 380,48 730,117 410,173" fill="#1c3951" stroke="#44677e"/><polygon points="65,105 410,173 410,360 65,289" fill="#102c46"/><polygon points="410,173 730,117 730,285 410,360" fill="#0f263c"/>${[[75,'市电','GRID'],[245,'UPS','在线双变换'],[415,'ATS','切换开关'],[585,'关键负载','IT LOAD']].map(([x,txt,en])=>`<g data-device="${txt}" style="cursor:pointer" transform="translate(${x},170)"><rect width="132" height="104" rx="9" fill="#1d3d55" stroke="#668ca6" stroke-width="2"/><rect x="10" y="13" width="112" height="27" rx="4" fill="#092137"/><text x="66" y="32" text-anchor="middle" fill="#e6f6fd" font-size="15">${txt}</text><text x="66" y="63" text-anchor="middle" fill="#97b6cb" font-size="11">${en}</text><circle cx="116" cy="84" r="6" fill="${live?'#35e1a9':'#ff7e89'}" class="blink"/></g>`).join('')}<path d="M210 220 H237 M380 220 H407 M550 220 H577" stroke="${live?'#41e8c3':'#f87e88'}" stroke-width="6" class="power-flow"/><path d="M440 125 L490 103 L560 140 L560 178" stroke="#ffcd78" stroke-width="5" stroke-dasharray="7 8" class="power-flow"/><rect data-device="柴油发电机" x="440" y="66" width="140" height="47" rx="8" fill="#273e48" stroke="#caa977"/><text x="510" y="94" text-anchor="middle" fill="#ffe1a7" font-size="14">柴油发电机</text><text x="85" y="322" fill="#a3c8df" font-size="15">供电链路状态仿真</text>`}

function bindControls(){document.querySelectorAll('.scene-svg [data-device]').forEach(el=>el.addEventListener('click',()=>{const device=el.getAttribute('data-device');addLog('检查设备：'+device);toast('已选中 '+device+'；状态与操作判定详见控制台');render()}));document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{const l=current();if(!l)return;const s=lessonState(l);let v=b.dataset.value;if(v==='true')v=true;if(v==='false')v=false;if(l.id==='PWR-06'&&b.dataset.key==='closed'&&v===true&&!syncOK(s)){toast('同期条件不合格，已模拟闭锁合闸');addLog('同期检验未通过，禁止模拟合闸');return}if(l.id==='PWR-04'&&b.dataset.key==='ats'&&v==='gen'&&!(s.gen==='ready'&&s.utility==='off')){toast('联锁拒绝：备用电源未合格或市电未故障');addLog('ATS联锁拒绝不符合条件的切换');return}if(l.id==='DC-08'&&b.dataset.key==='transfer'&&v===true&&s.gen!=='ready'){toast('联锁拒绝：柴发尚未稳定');addLog('柴发未具备供电条件，ATS不允许转移');return}if(l.id==='DC-02'&&b.dataset.key==='rack'&&v===true&&!s.rails){toast('请先安装并核对导轨');return}s[b.dataset.key]=v;result=null;addLog((l.controls.find(c=>c.key===b.dataset.key)?.label||b.dataset.key)+' → '+(typeof v==='boolean'?(v?'完成':'撤销'):(l.controls.find(c=>c.key===b.dataset.key)?.options?.[v]||v)));store();render()}));document.querySelectorAll('[data-range]').forEach(b=>{b.addEventListener('input',()=>{const label=b.closest('.control').querySelector('.control-label b');const c=current().controls.find(c=>c.key===b.dataset.range);label.textContent=Number(b.value).toFixed(Number.isInteger(c.step)?0:((String(c.step).split('.')[1]||'').length))+c.unit});b.addEventListener('change',()=>{const l=current();const s=lessonState(l);s[b.dataset.range]=Number(b.value);if(l.id==='PWR-06'&&s.closed&&!syncOK(s))s.closed=false;result=null;addLog(l.controls.find(c=>c.key===b.dataset.range).label+' → '+b.value);store();render()})});document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const l=current();const s=lessonState(l);const idx=Number(b.dataset.step),steps=l.controls.find(x=>x.type==='steps').steps;if(idx!==s.progress){toast('操作顺序错误：请先执行第'+(s.progress+1)+'步');addLog('拦截跳步：'+steps[idx]);return}s.progress++;result=null;addLog('步骤'+s.progress+'完成：'+steps[idx]);store();render()}));document.querySelectorAll('[data-level]').forEach(b=>{b.addEventListener('click',()=>openLevel(b.dataset.level));b.addEventListener('keydown',e=>{if(e.key==='Enter')openLevel(b.dataset.level)})});document.querySelectorAll('[data-navto]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.navto)));document.getElementById('accept')?.addEventListener('click',()=>{const l=current();const s=lessonState(l);let checks=l.checks.map(c=>!!c.fn(s));let success=checks.every(Boolean);result={success};if(success){state.progress[l.id]={date:new Date().toISOString(),checks:checks.length};toast('✓ '+l.id+'验收通过，已保存本机成绩')}else toast('验收有'+checks.filter(x=>!x).length+'项未通过，请按提示修正');addLog(success?'自动验收通过':'自动验收未通过');store();render()});document.getElementById('reset')?.addEventListener('click',()=>{const l=current();state.attempts[l.id]=structuredClone(l.initial);result=null;logs=[];store();render();toast('本关状态已重置')});document.getElementById('next-level')?.addEventListener('click',()=>{let i=LEVELS.indexOf(current());openLevel(LEVELS[(i+1)%LEVELS.length].id)});document.getElementById('rotate')?.addEventListener('click',()=>{state.view=(state.view+1)%3;let el=document.getElementById('scene-container');el.style.transform=state.view===0?'none':state.view===1?'translateX(-2%) scale(1.13) rotate(-2deg)':'translateX(2%) scale(1.1) rotate(2deg)'});document.getElementById('details')?.addEventListener('click',()=>toast('实时图形为设备逻辑/透视示意；右侧更改参数，左侧数值与设备状态同步变化。'))}
function addLog(msg){logs.push(new Date().toLocaleTimeString('zh-CN',{hour12:false})+' '+msg);if(logs.length>60)logs.shift()}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));document.getElementById('help').addEventListener('click',()=>toast('点击课程 → 调整参数/执行步骤 → 观察状态 → 自动验收。手机可直接打开此HTML离线使用。'));document.getElementById('export').addEventListener('click',()=>{let csv='关卡编号,分类,课程名称,是否通过,通过时间\n'+LEVELS.map(l=>[l.id,GROUPS[l.group].name,l.title,state.progress[l.id]?'通过':'未通过',state.progress[l.id]?.date||''].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='智维实训_24关成绩.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});render();if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}window.__lab={LEVELS,lessonState,state,check:id=>{let l=LEVELS.find(x=>x.id===id);return l.checks.map(k=>k.fn(lessonState(l)))},functions:{motorI,mccVD,shortCircuitKA,pfcNeed,relayTime,inletTemp,batteryMin,syncOK}};
