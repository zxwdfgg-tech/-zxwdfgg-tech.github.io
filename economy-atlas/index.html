</style></head><body data-mode="single"><div id="app"></div><div id="site-toast" class="toast" role="status" aria-live="polite"></div><script>window.ATLAS_ARTICLES=[{"id":"growth-and-wallet","category":"macro","title":{"zh":"GDP增长了，为什么钱包却没有变鼓？","en":"Why GDP Growth Does Not Always Feel Like Prosperity"},"deck":{"zh":"同一个经济体的增长数字，为什么会对应千差万别的生活感受？","en":"A growing economy can still leave many households feeling squeezed."},"sections":{"zh":["国内生产总值统计的是一定时期内创造的增加值，不是居民银行卡余额的加总。工厂投资一条生产线、企业建设一个数据中心，都会推高当期经济活动，但不代表每个家庭当年的可支配收入同步增加。经济总量回答的是“生产了多少”，居民感受回答的是“我分到了多少、能买到什么”。","把总量变成生活水平，中间至少隔着三道门：增长成果在工资、利润和税收之间如何分配；物价变化如何影响实际购买力；住房、教育与医疗等不可轻易减少的支出占收入多少。同样的工资增长，租房者和已还清房贷的人体验可能完全不同。平均值还可能掩盖不同地区、年龄和行业之间的差异。","判断自己的经济处境，不妨同时看四张表：实际可支配收入、就业与工资、家庭必要支出以及债务偿付压力。看新闻时也要追问：这是名义增长还是扣除物价后的实际增长？是人均数据还是总量？是大多数人的改善，还是少数行业的贡献？这样才能把宏观叙事翻译成自己的生活。"],"en":["Gross domestic product measures value added during a period; it does not measure the money sitting in household bank accounts. Investment in a factory or data center can increase economic output without immediately raising every worker's disposable income. Output and living standards are related, but they answer different questions.","At least three filters stand between national growth and personal prosperity: the division of income among labor, capital and government; changes in prices; and the share of income consumed by hard-to-avoid costs such as rent, healthcare and education. An average can also conceal sharp differences between regions, industries and generations.","To assess whether an economy is improving for ordinary people, compare inflation-adjusted household income, labor-market conditions, essential living costs and debt payments. Ask whether a headline refers to nominal or real growth, aggregate or per-capita figures, and broad gains or a narrow sector. Those distinctions turn a headline into a useful diagnosis."]},"point":{"zh":"增长是生产的故事，富裕是分配、物价和生活成本共同决定的故事。","en":"Growth tells a story about production; prosperity also depends on distribution, prices and living costs."},"terms":[["GDP","国内生产总值"],["Real income","实际收入"],["Disposable income","可支配收入"]],"source":"https://data.worldbank.org/"},{"id":"inflation-basket","category":"macro","title":{"zh":"通胀下降，不等于物价回到从前","en":"Lower Inflation Does Not Mean Falling Prices"},"deck":{"zh":"“涨得慢了”与“变便宜了”之间，差了关键的一步。","en":"Why slower price increases are not the same as cheaper goods."},"sections":{"zh":["物价指数像一个不断更新的购物篮，观察一组商品和服务的总体价格变化。假设去年一件商品从100元涨到110元，今年只涨到112元，那么通胀率明显下降，但买东西仍然比两年前贵。通胀下降描述的是涨价速度放缓，价格水平下降则叫通缩，这两件事不能混为一谈。","每个人的购物篮都不同。以食品、房租为主要支出的家庭，对生活成本的感受可能与统计中的平均家庭差别很大。还有一个容易忽略的因素：替代行为。牛肉贵了，有人买鸡肉；但这种“换着买”未必意味着生活质量不受影响。","想判断购买力，就把物价与收入放到一起看。工资上涨4%、必要开支上涨6%，名义收入变多，实际生活可能更紧。价格稳定通常有利于规划，但物价突然普遍下跌也未必是好消息：如果伴随需求不足和失业，家庭反而可能更难过。"],"en":["A consumer price index follows the cost of a representative basket of goods and services. If an item rises from 100 to 110 one year and then to 112 the next, inflation has slowed, yet the item remains more expensive. Disinflation means prices are rising more slowly; deflation means the general price level is falling.","No two households buy the same basket. Food, rent and transport may dominate one family's budget but not another's. Statistical averages also involve substitution: consumers may switch to a cheaper product when prices rise, but that adjustment can come with a real sacrifice in quality or convenience.","The practical question is whether earnings are keeping up with the prices that matter to you. A 4% pay increase alongside a 6% rise in essential spending can leave a household worse off in real terms. Stable inflation is useful for planning, but broad price declines can be harmful when they accompany collapsing demand and job losses."]},"point":{"zh":"记住两条线：物价水平，以及物价上涨的速度。","en":"Always distinguish the price level from the rate at which it changes."},"terms":[["Inflation","通货膨胀"],["Disinflation","通胀放缓"],["Purchasing power","购买力"]],"source":"https://www.bls.gov/cpi/"},{"id":"interest-rate-path","category":"money","title":{"zh":"央行降息了，为什么你的贷款还没变便宜？","en":"Why Rate Cuts Take Time to Reach Your Loan"},"deck":{"zh":"政策利率、银行融资成本与个人账单之间不是一根直线。","en":"The path from a policy rate to a monthly payment is rarely direct."},"sections":{"zh":["中央银行直接影响的是货币市场中的某些基准利率或流动性条件，而你的贷款利率往往还受贷款合同、重定价周期、银行资金成本和个人信用风险影响。因此“今天降息”并不等于“下个月月供必降”。固定利率贷款尤其如此。","金融传导像一段有摩擦的管道。银行会考虑存款竞争、坏账风险、资本约束和未来利率预期。利率降得太慢，企业和家庭可能暂时感受不到宽松；降得太快，银行也未必愿意对高风险借款人同步降低报价。不同贷款、存款和债券之间的反应速度可能大不相同。","比追逐单次新闻更有用的，是读清自己的合同：固定还是浮动、何时重定价、参考什么基准、有没有提前还款成本。宏观层面，还要观察信贷数量和借贷意愿。钱“变便宜”与人“愿意借钱”是两回事。"],"en":["Central banks influence short-term benchmark rates and financial conditions. Your borrowing cost also depends on contract terms, repricing dates, bank funding costs and your credit risk. A policy rate cut today does not guarantee a lower mortgage bill next month—especially with fixed-rate debt.","Monetary transmission has friction. Banks weigh deposit competition, likely loan losses, capital requirements and expectations about future rates. Different products reprice at very different speeds, and lenders may refuse to pass on cheaper funding to riskier customers.","Rather than reacting to a single announcement, read your contract: fixed or floating, reset schedule, benchmark, spread and early repayment fees. Also watch credit availability and borrowing appetite. Cheaper money is not the same as greater willingness to borrow, invest or spend."]},"point":{"zh":"利率政策要经过合同、银行和信心三重传导，才会进入家庭账本。","en":"Policy must pass through contracts, banks and confidence before reaching household budgets."},"terms":[["Policy rate","政策利率"],["Transmission","政策传导"],["Repricing","利率重定价"]],"source":"https://www.bis.org/"},{"id":"stock-economy","category":"markets","title":{"zh":"股市上涨，为什么不代表经济一定变好？","en":"Why the Stock Market Is Not the Economy"},"deck":{"zh":"股价看未来的利润折现，经济生活看当下的工资与支出。","en":"Stocks discount future profits; households live with current cash flows."},"sections":{"zh":["股票价格反映的是投资者对上市公司未来现金流、风险和利率的预期。企业可能通过削减成本提高利润，即使就业增长不强；也可能因为市场预期未来降息而估值上涨，即使眼下经济数据平平。股价与居民收入并不是同一套指标。","指数还会受到“谁被算进去”的影响。少数大型公司权重很高时，它们的上涨可能拉动整个指数，而中小企业、个体商户和大多数劳动者并未同步受益。经济全球化也意味着上市公司的利润可以来自海外，与本国消费者的经历并不一致。","看市场时把三个问题分开：盈利有没有改善？估值是不是更贵了？上涨是不是集中在少数公司？看社会经济状况则需要另外检查就业、工资、生产率和消费。把两套数据放在一起才有意义，不必强迫它们讲同一个故事。"],"en":["A stock price reflects expectations of a company's future cash flows, risk and interest rates. Profits can improve after cost cutting even when hiring is weak. Valuations can rise in anticipation of lower rates even when current economic activity remains subdued. Equity prices and household incomes are not interchangeable measures.","An index is also shaped by its composition. When a handful of giant companies dominate market capitalization, their gains can lift the benchmark even if small businesses and workers are struggling. Listed firms may earn much of their revenue abroad, further weakening the link to domestic living standards.","Separate three questions: are earnings growing, are investors paying more for each unit of earnings, and is the rally broad or concentrated? Then compare the answer with independent data on employment, pay, productivity and spending. Markets and economies influence each other, but they do not tell identical stories."]},"point":{"zh":"股市是预期与资产定价的温度计，不是全民生活水平的体温计。","en":"The stock market measures priced expectations, not everyone’s standard of living."},"terms":[["Valuation","估值"],["Earnings","公司盈利"],["Market concentration","指数集中度"]],"source":"https://www.investor.gov/"},{"id":"family-balance-sheet","category":"household","title":{"zh":"家庭真正的安全感，不只看存款数字","en":"A Resilient Household Is More Than Its Bank Balance"},"deck":{"zh":"收入、负债、流动性、风险承受能力，缺一不可。","en":"Cash flow, liquidity and risk matter as much as net worth."},"sections":{"zh":["家庭资产负债表记录“拥有什么”和“欠了什么”，现金流量表记录“每个月进来多少、出去多少”。有房有车但短期无法变现，不等于手头有钱。尤其在收入波动时，能否覆盖几个月的必要开支，比纸面资产总额更直接。","负债也不能只看总金额。利率、期限、每月最低还款和是否存在集中到期，决定了真实压力。两个人负债同样多，固定低息长贷与高息短贷的现金流风险完全不同。保险、就业稳定性和家庭成员的照护需求同样影响风险。","做一次简单的压力测试：如果收入下降三分之一，必要支出与还款还撑得住吗？如果突然要支付医疗、教育或维修费用，资金从哪里来？先建立稳定预算和适当应急储备，再谈长期投资，往往比追求“最高收益率”更符合家庭财务目标。"],"en":["A household balance sheet shows assets and liabilities; a cash-flow statement shows money coming in and going out. Owning property does not necessarily mean having accessible cash. When earnings are uncertain, the ability to cover essential expenses for a period of time may matter more than headline net worth.","Debt risk depends on structure, not just the amount owed. Interest rates, maturity dates, required payments and refinancing needs change the picture. A long-term fixed-rate mortgage and a short-term high-interest loan create very different pressures even at the same principal amount.","Run a practical stress test: could the family cope with a one-third loss of income? Where would the money come from for an unexpected repair or medical bill? Stable budgeting, an appropriate emergency buffer and manageable payments usually deserve attention before chasing the highest possible investment return."]},"point":{"zh":"财富是存量，安全感更多来自流动性与可持续的现金流。","en":"Net worth is a stock; resilience depends heavily on liquidity and sustainable cash flow."},"terms":[["Net worth","净资产"],["Liquidity","流动性"],["Emergency fund","应急储备"]],"source":"https://www.consumerfinance.gov/consumer-tools/"},{"id":"housing-system","category":"housing","title":{"zh":"一套房子的价格，到底由什么决定？","en":"What Really Sets the Price of a Home?"},"deck":{"zh":"房子同时是住所、土地权利、信贷产品和资产。","en":"Housing is shelter, land, credit exposure and an asset at once."},"sections":{"zh":["房价不是简单由钢筋水泥成本决定的。人们支付的还包括地段、公共服务、通勤时间、学区预期和未来转售可能性。在一些城市，建筑本身可以复制，稀缺的是便利位置以及允许建设的土地和规则。","需求端既受人口和收入影响，也受利率、首付款比例和信贷可得性影响。供给端则取决于土地制度、建设周期、施工成本与审批限制。因此“人口下降房价一定跌”或“降息房价一定涨”，都遗漏了区域差异和供需调整速度。","准备购房时，可以把“居住价值”和“投资回报”分别估算：等价租金、持有成本、流动性、杠杆风险、计划居住年限及城市人口和就业趋势。即便认为未来房价会涨，也不能忽略现金流是否承受得起。"],"en":["Home prices reflect far more than bricks and labor. Buyers pay for location, services, commute time, perceived school access and the possibility of resale. Buildings can often be replicated; scarce, well-connected land and permission to build may be harder to reproduce.","Demand responds to population, incomes, mortgage rates, deposits and lending standards. Supply responds to planning rules, construction capacity, costs and delays. That is why neither falling population nor lower rates produces the same housing outcome in every city.","When considering a home, estimate its value as shelter separately from its potential return as an investment. Compare the cost of renting, ownership expenses, leverage, ability to sell, expected time in the property and local employment trends. Even a plausible price forecast is not a substitute for a sustainable monthly budget."]},"point":{"zh":"住房市场的第一条规则：全国平均房价，不能替代你所在城市的供需。","en":"National house-price averages cannot replace local supply-and-demand analysis."},"terms":[["Housing supply","住房供给"],["Mortgage","住房贷款"],["Price-to-rent ratio","房价租金比"]],"source":"https://www.oecd.org/en/topics/housing.html"},{"id":"ai-work","category":"work","title":{"zh":"AI把工作做快了，为什么工资不一定更高？","en":"If AI Makes Work Faster, Who Gets the Gains?"},"deck":{"zh":"生产率上升，最终由谁分到好处，取决于谈判与制度。","en":"Productivity gains do not automatically flow into wages."},"sections":{"zh":["人工智能能把一小时的工作压缩成十分钟，但节省下来的时间不自动变成加薪。企业可能降低价格扩大销量，也可能提高利润、减少招聘，或者把更多任务交给原有员工。技术提高的是完成任务的能力，收入变化取决于市场竞争与制度安排。","职业不是一整块不可拆分的东西，而是一组任务。AI可能替代其中的重复部分，同时提高人的判断、沟通与现场执行价值。与此同时，容易被标准化的初级任务变少，可能抬高新人入行门槛。不同岗位的得失会非常不均衡。","个人的策略不应只是“学会一个工具”。更值得建立的是问题定义、领域知识、错误核验、跨部门协作和对结果负责的能力。企业层面则要看培训投资、任务重新设计和生产率收益的分配。技术浪潮的最终影响，不只是一场模型竞赛。"],"en":["AI can compress an hour of work into ten minutes, but time saved does not automatically become higher pay. Firms might cut prices, grow output, raise margins, reduce recruitment or assign more work to existing employees. Technology changes productive capability; bargaining power and competition shape the distribution of gains.","A job is a bundle of tasks rather than one indivisible activity. AI can automate routine components while making judgment, communication and real-world execution more valuable. Yet fewer entry-level tasks may also make it harder for newcomers to gain experience. Effects vary greatly by occupation.","The most useful career strategy goes beyond learning a single application. Build domain knowledge, the ability to frame problems, verify outputs, coordinate people and take responsibility for results. For firms, training and redesigning work matter as much as buying technology. The economics of AI is not just a contest between models."]},"point":{"zh":"不要只问“AI能替代谁”，还要问“效率红利归谁”。","en":"Ask not only whose tasks AI replaces, but who captures the productivity dividend."},"terms":[["Productivity","生产率"],["Task automation","任务自动化"],["Bargaining power","议价能力"]],"source":"https://www.ilo.org/"},{"id":"tariff-payer","category":"trade","title":{"zh":"一项关税，最后究竟是谁买单？","en":"Who Actually Pays a Tariff?"},"deck":{"zh":"从海关账单到超市价签，中间藏着完整的成本链。","en":"Follow the cost from customs to the shopping cart."},"sections":{"zh":["关税通常在商品进口时由进口商向海关缴纳，法律上并不是出口国政府替消费者付钱。但最后的经济负担可以通过涨价、压低进口商利润、出口商降价或供应链调整分摊。谁承担多少，要看替代品、竞争程度和需求弹性。","短期内，企业可能来不及换供应商，消费者看到的价格更容易上涨。长期则可能出现产业迁移和国产替代，却也会产生重复建设、效率损失或其他成本。受保护的行业可能增加岗位，用进口投入品的行业却可能面临更高成本。","判断一项关税政策，不要只看某个产业的新增工厂。还要看最终价格、下游企业、消费者选择、税收收入和潜在的贸易报复。政策可能追求供应链安全等非价格目标，但这些目标同样需要清楚说明代价与收益。"],"en":["Importers generally pay tariffs to customs authorities when goods enter a country. That does not mean they bear the entire economic cost, nor does a foreign government simply pay the bill. The burden can be shared through higher consumer prices, lower margins, exporter discounts and changes in suppliers.","In the short run, firms may struggle to switch suppliers, making price effects more visible. Over time, production may move or domestic substitutes may emerge, but adjustment can involve duplication, lost efficiency and higher input costs. Jobs protected in one sector can be offset by pressure on downstream industries.","Evaluate a tariff by looking beyond a new factory announcement. Consider retail prices, input users, choice, fiscal revenue and the risk of retaliation. Governments may pursue resilience or strategic security, not merely low prices. Those objectives still deserve transparent discussion of trade-offs."]},"point":{"zh":"征税对象、法定付款人和最终经济负担，可能是三种不同的答案。","en":"The good taxed, the legal payer and the ultimate bearer of the cost can differ."},"terms":[["Tariff","关税"],["Incidence","税负归宿"],["Supply chain","供应链"]],"source":"https://www.wto.org/"},{"id":"energy-bill","category":"energy","title":{"zh":"同样一度电，为什么不同时间价格差那么多？","en":"Why a Kilowatt-Hour Can Have Different Prices"},"deck":{"zh":"电力市场让人看到：同一种商品，也有完全不同的时间价值。","en":"Electricity illustrates the economic value of timing and reliability."},"sections":{"zh":["电能需要生产与消费在瞬间保持平衡，而大规模存储存在成本和限制。中午阳光充足、风力强劲时，边际发电成本可能很低；傍晚负荷上升或系统受限时，需要启用成本更高的机组，价格便可能变化。不同地区的输电瓶颈会加剧差异。","终端电费并不只有发电成本，还可能包含输配电网络、容量保障、税费以及各种政策附加。居民长期合约会平滑波动，所以现货市场某个小时价格很高，不一定意味着家庭账单同步跳升。","对家庭与企业来说，节能是减少总用量，负荷管理是把可移动的用电安排到更合适的时间。储能、需求响应和更强的电网互联，可以帮助系统在成本与可靠性之间取得平衡；单纯增加装机容量并不能解决所有问题。"],"en":["Electricity supply and demand must balance in real time, while large-scale storage remains costly and limited. Solar and wind output may make marginal generation cheap at one hour; evening demand or network congestion may require more expensive capacity later. Geography matters too: power cannot always move freely across transmission lines.","A retail electricity bill includes more than generation. Networks, capacity, taxes and policy charges can all play a role. Contracts also smooth wholesale volatility, so a dramatic hourly spot price need not instantly appear on a household bill.","Using less energy reduces total consumption; load shifting moves flexible demand to cheaper or less congested hours. Storage, demand response and stronger grids can improve the balance between cost and reliability. More generating capacity helps, but is not by itself a complete solution to the economics of electricity."]},"point":{"zh":"电力的成本，不仅取决于用多少，还取决于何时、何地以及是否必须可靠供应。","en":"Electricity costs depend on when, where and how reliably power must be delivered."},"terms":[["Marginal cost","边际成本"],["Demand response","需求响应"],["Grid congestion","电网阻塞"]],"source":"https://www.iea.org/"},{"id":"ageing-economy","category":"population","title":{"zh":"少子化的经济影响，远不止“劳动力变少”","en":"The Economics of an Ageing Society"},"deck":{"zh":"养老、住房、生产率和财政，都会在代际结构变化中重排。","en":"Ageing changes fiscal choices, labor markets and the shape of demand."},"sections":{"zh":["当年轻人口占比下降，劳动供给可能收紧，但具体结果取决于就业参与率、退休年龄、移民和生产率。与此同时，消费结构也在变化：医疗、照护与便利服务需求可能增加，学校招生、首次购房和婴幼儿产品市场则可能承压。","养老金系统有不同形式，但无论采用现收现付还是积累安排，最终都绕不开一个现实：未来社会生产的商品和服务需要在各年龄群体之间分配。人口问题因此同时是财政问题、生产率问题和代际公平问题。","比单纯比较出生人数更有用的，是观察健康预期寿命、就业率、劳动生产率、照护基础设施和地方人口流动。一个地区人口缩减，并不自动意味着每个居民都会变穷；关键是制度能否适应新的年龄结构。"],"en":["A smaller share of young people may tighten labor supply, but the outcome depends on participation, retirement decisions, migration and productivity. Demand also changes: healthcare and care services may expand while schools, first-home purchases and baby products face different pressures.","Pension systems take different forms, yet pay-as-you-go and funded arrangements confront a shared reality: goods and services produced in the future must be allocated across generations. Demography is therefore a fiscal, productivity and fairness issue as much as a population statistic.","Instead of treating birth counts as destiny, examine healthy life expectancy, employment participation, output per worker, care infrastructure and regional migration. Population decline does not mechanically make every resident poorer. The central question is whether institutions can adapt to a different age structure."]},"point":{"zh":"人口不是宿命，决定长期富裕的还有劳动参与、生产率与制度适应。","en":"Demography matters, but participation, productivity and institutional adaptation matter too."},"terms":[["Dependency ratio","抚养比"],["Productivity","生产率"],["Pension system","养老体系"]],"source":"https://population.un.org/wpp/"},{"id":"discount-trap","category":"behavior","title":{"zh":"为什么打折反而让我们花更多钱？","en":"Why Discounts Can Make Us Spend More"},"deck":{"zh":"我们并非总在购买商品，有时是在购买“占到便宜”的感觉。","en":"Sometimes a bargain changes the decision rather than merely the price."},"sections":{"zh":["打折时，人会先看到“原价300元，现在199元”，容易把省下的101元当作收益，却忽略原本可能根本不需要这件商品。原价形成锚点，限时倒计时制造紧迫感，“满减还差一点”则诱导额外支出。","理性的比较基准不该只是标价，而应该是“我不买会怎样”。如果不买是零支出，199元的冲动消费就不是节省101元。行为经济学还研究损失厌恶：错过优惠带来的遗憾，心理上可能比得到同额折扣的快乐更强。","给购物设一道简单的关卡：没有打折时，是否仍愿意以当前价格购买？这笔开支是不是在原定预算之内？未来一周是否还会需要？延迟购买能降低时间压力，把决定权从促销页面拿回来。"],"en":["A discount frames a purchase as a gain: a product was 300 and is now 199, so it feels as if 101 has been saved. But if the item was never needed, the relevant comparison may be zero spending. Reference prices become anchors, timers create urgency and minimum-spend promotions encourage extra items.","The right baseline is often not the original sticker price but the alternative of not buying at all. Behavioral economics studies loss aversion: the pain of missing an offer can feel stronger than the pleasure of obtaining a similar gain. This can turn an optional purchase into an apparent emergency.","Try three questions before buying: would I pay the current price without the sale label? Was the expense already in the budget? Would I still want it next week? A short delay weakens the pressure created by countdowns and returns attention to actual use rather than advertised savings."]},"point":{"zh":"省钱的第一步不是发现折扣，而是确认自己本来需要买。","en":"The first step in saving money is checking whether the purchase was necessary."},"terms":[["Anchoring","锚定效应"],["Loss aversion","损失厌恶"],["Opportunity cost","机会成本"]],"source":"https://www.behavioraleconomics.com/resources/mini-encyclopedia-of-be/"},{"id":"coffee-shop","category":"business","title":{"zh":"一家咖啡店，藏着多少经济学？","en":"The Hidden Economics of a Coffee Shop"},"deck":{"zh":"租金、客流、定价、毛利和复购，连起来就是一门微观经济学。","en":"Every cup of coffee reveals pricing, fixed costs and local demand."},"sections":{"zh":["一家咖啡店卖30元一杯，不代表每杯能赚30元。咖啡豆、牛奶、杯子和支付手续费构成部分可变成本；店租、设备折旧、基础人员配置则更接近固定成本。销量上升后，固定成本能被更多杯咖啡分摊，这就是规模经济的一种表现。","高客流路段租金昂贵，不一定意味着利润更差。人流、停留时间、附近竞争和用户对品牌的感知，共同影响单位面积的营收。低价策略可以吸引顾客，却可能要求更高的周转率；高端定位则依赖稳定体验和复购。","观察一家生意，不只看排队人数。可以追问单杯贡献毛利、每天售出数量、盈亏平衡点、回头客比例以及店主能否持续维持品质。理解这些数字，比单看“网红店开了多少家”更接近商业的真实结构。"],"en":["A café charging 30 for a drink does not earn 30 in profit. Beans, milk, cups and transaction fees are variable costs; rent, equipment and baseline staffing are closer to fixed costs. Selling more cups spreads fixed costs across greater volume—a basic form of scale economics.","An expensive location can still be profitable if footfall, customer dwell time and pricing power compensate for rent. Low prices may bring traffic but require rapid turnover; premium positioning depends more heavily on repeat purchases and service consistency.","Queues are a poor substitute for unit economics. Ask about contribution margin per drink, daily volume, the break-even point and the proportion of returning customers. These questions explain why two cafés with equal popularity may have very different financial outcomes."]},"point":{"zh":"商业不是“卖得贵就赚得多”，而是单位经济、客流与固定成本的组合。","en":"Business success depends on unit economics, traffic and fixed costs—not just price."},"terms":[["Fixed cost","固定成本"],["Contribution margin","贡献毛利"],["Break-even point","盈亏平衡点"]],"source":"https://www.sba.gov/business-guide"},{"id":"debt-cycle","category":"money","title":{"zh":"借债能推动增长，也可能把未来提前花掉","en":"How Debt Can Build the Future—and Borrow from It"},"deck":{"zh":"债务不是天然的好坏之分，关键在用途、成本和偿还能力。","en":"Debt is a tool whose value depends on use, cost and repayment capacity."},"sections":{"zh":["借钱建设能提高未来产出的设备、教育或基础设施，可能创造超过融资成本的收益。但如果借款只用来维持无法持续的支出，或者资产回报远低于利息，未来收入就要被拿来偿还过去的消费。债务既可以跨越时间配置资源，也可能把风险带到未来。","借贷扩张常常与资产价格互相影响：抵押品价值上升让人更容易借钱，更多信贷又可能推高抵押品价格。反过来，当价格下跌、贷款收紧时，企业和家庭可能被迫同步缩减支出，放大经济波动。","分析债务，不要只盯着“总债务很大”。更重要的是期限结构、币种、利率、谁持有债权、资金用途以及债务人的现金流。能够长期再融资的主体，与依靠短债滚动维持生存的主体，处境完全不同。"],"en":["Borrowing for equipment, education or infrastructure can create returns greater than its financing cost. Borrowing to fund persistent expenses without future income may simply transfer the burden into later years. Debt reallocates resources across time, which makes it both useful and potentially dangerous.","Credit and asset values can reinforce each other. Rising collateral prices make borrowing easier; abundant credit can then push collateral prices higher. In reverse, falling prices and tighter lending can force simultaneous cuts in spending and amplify a downturn.","Do not judge debt by its headline size alone. Examine maturities, currency, interest costs, creditors, the use of borrowed funds and repayment cash flows. A borrower with dependable long-term financing faces a very different risk from one reliant on constant short-term refinancing."]},"point":{"zh":"好债务创造未来现金流；坏债务要求未来为今天填坑。","en":"Productive debt supports future cash flow; fragile debt merely postpones a shortfall."},"terms":[["Leverage","杠杆"],["Refinancing","再融资"],["Debt service","偿债支出"]],"source":"https://www.imf.org/en/Publications/GFSR"},{"id":"dollar-global","category":"global","title":{"zh":"美元为什么能影响千里之外的生活？","en":"Why the Dollar Matters Beyond America"},"deck":{"zh":"贸易计价、全球借贷和金融避险，让一种货币拥有超出国境的影响。","en":"Trade invoicing and global borrowing extend the dollar’s reach."},"sections":{"zh":["世界上大量跨境贸易、金融合同和外汇交易以美元计价或结算，即便交易双方都不是美国企业。当美元融资变贵时，部分海外借款人的还本付息成本会上升；大宗商品以美元标价，也使汇率变化影响进口成本。","汇率不是一个简单的国家实力排行榜。货币升值会使进口更便宜，也可能损害出口竞争力；贬值可能有利于出口收入，却提高外币债务与进口商品成本。不同家庭、企业和行业面对同一汇率变动，感受可能相反。","理解全球美元体系，可以同时追踪三个维度：美元在跨境合同中的作用、美国利率对融资成本的影响，以及本币与美元之间的汇率变化。分析时应避免“美元涨，所有国家都受损”之类过度简单的说法。"],"en":["Many international trade contracts, loans and foreign-exchange transactions use dollars even when neither party is American. When dollar funding becomes more expensive, some borrowers abroad face higher servicing costs. Dollar-denominated commodities also transmit exchange-rate movements into import prices.","An exchange rate is not a simple ranking of national strength. Appreciation may lower import prices while reducing export competitiveness; depreciation may help exporters but raise the local-currency cost of foreign debt and imports. Households and firms can experience the same currency move in opposite ways.","To understand the global dollar system, separate its role as an invoicing currency, the effect of US interest rates on financing, and bilateral exchange-rate movements. Avoid sweeping claims that a stronger dollar has an identical effect everywhere."]},"point":{"zh":"美元的全球影响，来自交易网络与融资结构，不只是美国的经济规模。","en":"The dollar’s global influence rests on financial networks and contracts, not only the US economy."},"terms":[["Reserve currency","储备货币"],["FX rate","汇率"],["Dollar funding","美元融资"]],"source":"https://www.bis.org/statistics/"},{"id":"climate-price","category":"climate","title":{"zh":"给碳排放定价，为什么经济学家总在争论？","en":"The Economics Behind Carbon Pricing"},"deck":{"zh":"排放的成本不只由排放者承担，政策试图改变这一点。","en":"Carbon pricing tries to bring external costs into private decisions."},"sections":{"zh":["一座工厂的排放可能影响远处居民的健康和未来气候，却未必全部进入工厂的财务成本。这被称为外部性。碳税与排放交易的共同思路，是让排放行为面对某种经济价格，从而鼓励节能、低碳技术和生产方式调整。","难题在于，价格信号会沿着供应链传递。能源、运输和部分商品变贵，低收入家庭可能受到更明显的压力。政策如果不配套退税、补贴或公共交通改善，可能遭遇反对。排放核算、地区协调和产业竞争也是难点。","评价碳定价不应只问税率高低，而要看实际减排效果、成本分配、收入用途与替代技术的可获得性。经济学提供了分析工具，但无法替社会直接决定哪些群体应承担多少转型代价。"],"en":["A factory’s emissions may impose health and climate costs far beyond its premises, without those costs appearing fully on its books. Economists call this an externality. Carbon taxes and emissions trading seek to attach a price to emissions and encourage conservation, cleaner technologies and different production choices.","The price signal spreads through supply chains. Higher energy and transport costs may burden lower-income households disproportionately. Without rebates, infrastructure investment or other compensation, the policy can face resistance. Measuring emissions and preserving competitiveness add further complexity.","A useful assessment considers emissions reductions, who pays, how revenue is used and whether alternatives are accessible. Economics can clarify trade-offs, but cannot determine society's preferred distribution of the transition burden on its own."]},"point":{"zh":"好的气候政策不只要减少排放，还要解释清楚谁付费、谁得到补偿。","en":"Effective climate policy must address both emissions and the distribution of costs."},"terms":[["Externality","外部性"],["Carbon tax","碳税"],["Emissions trading","碳排放交易"]],"source":"https://www.worldbank.org/en/programs/pricing-carbon"},{"id":"city-rent","category":"cities","title":{"zh":"为什么机会越多的城市，房租越贵？","en":"Why Opportunity-Rich Cities Often Have Expensive Rent"},"deck":{"zh":"城市的高工资和高租金，可能来自同一个增长引擎。","en":"Strong labor markets and high housing costs often share a cause."},"sections":{"zh":["企业密集的城市更容易形成劳动力匹配、知识交流和上下游协作。这种“集聚经济”有时提高生产率，也为一些岗位带来更高工资。更多人愿意迁入，居住空间需求随之上升。","如果住房建设受土地、规划或基础设施约束，新增需求就更容易体现为房租和房价上涨。于是一个奇怪的现象出现：工资越高的地方，扣掉住房与通勤之后，实际剩余收入未必更多。城市繁荣的部分收益可能被土地租金吸收。","比较工作机会时，不只看税前工资，还要把租金、交通、托育、公共服务、职业成长和失业风险放在一起。对城市政策来说，交通投资、住房供给和跨区域连接，可能与招商引资一样重要。"],"en":["Dense cities facilitate matching between workers and employers, sharing of ideas and coordination across suppliers. These agglomeration effects can raise productivity and wages. They also attract more residents, increasing demand for limited well-located housing.","When construction is constrained by land, planning or infrastructure, stronger demand may translate mainly into higher rents and property prices. A worker can earn more in a booming city yet retain less after housing and commuting costs. Some of the gains from urban productivity are captured through land rents.","Compare opportunities using after-tax, after-housing income alongside commuting time, childcare, public services and career growth. For city policymakers, transport links and additional housing supply can be as important as attracting employers."]},"point":{"zh":"城市的机会价值，必须扣除居住与通勤成本后再计算。","en":"The value of urban opportunity should be judged after housing and commuting costs."},"terms":[["Agglomeration","集聚经济"],["Land rent","土地租金"],["Cost of living","生活成本"]],"source":"https://www.worldbank.org/en/topic/urbandevelopment"},{"id":"degree-signals","category":"education","title":{"zh":"大学文凭是在提高能力，还是在发出信号？","en":"Does Education Build Skills or Signal Them?"},"deck":{"zh":"教育的经济回报，常由能力形成与劳动力市场筛选共同决定。","en":"Education may create human capital and help employers screen applicants."},"sections":{"zh":["教育可以传授知识、培养解决问题的能力，这叫人力资本积累。但文凭也可能向雇主传递“此人完成过长期学习与考核”的信号。两种机制可以同时存在，因此仅看毕业生工资较高，并不足以解释工资差距全部来自课堂本身。","当更多人取得相同学历，部分岗位可能提高招聘门槛，并不代表工作内容真的需要更高学位。与此同时，某些紧缺技能仍然可能供不应求。学历的回报还受到专业、学校、地区、经验以及就业周期影响。","做教育决策时，应比较完成学业的全部成本：学费、时间、机会成本和不确定性。关注具体技能、实习、作品和职业网络，而不只是证书名称。继续教育也不一定必须走全日制学历路径。"],"en":["Education can teach knowledge and problem-solving skills, creating human capital. A diploma can also signal to employers that a candidate has completed sustained study and assessment. Both mechanisms may operate at once, so the earnings advantage of graduates does not automatically reveal how much was learned in a classroom.","As degrees become more common, employers may raise screening requirements even when the work itself has not become more complex. Some specialized skills, however, remain scarce. Returns vary by field, institution, location, experience and business cycle.","A sound education decision compares tuition, time, foregone earnings and uncertainty against plausible benefits. Evidence of skill, projects, internships and professional networks may matter as much as a credential. Full-time degrees are not the only route to learning."]},"point":{"zh":"问“读什么”之前，先问“将获得什么能力、信号与机会”。","en":"Before choosing a degree, ask what skills, signals and opportunities it provides."},"terms":[["Human capital","人力资本"],["Signaling","信号理论"],["Opportunity cost","机会成本"]],"source":"https://www.oecd.org/en/topics/education.html"},{"id":"factory-return","category":"industry","title":{"zh":"制造业回流，真能让经济更强吗？","en":"Will Bringing Factories Home Strengthen an Economy?"},"deck":{"zh":"生产安全、产业韧性与成本效率之间存在真实的取舍。","en":"Resilience and cost efficiency can pull industrial policy in different directions."},"sections":{"zh":["一个国家把关键产品的生产链搬回本土，可能降低部分地缘风险，也可能创造当地岗位。但工厂地点不是唯一因素：零部件、设备、人才、能源和物流网络常常跨越多个国家。把最后一道组装工序迁回来，并不等于供应链完全自主。","本地生产可能面临更高工资、土地或合规成本，政府补贴也有财政代价。另一方面，遭遇突发中断时，额外产能和多元供应商又具有“保险价值”。市场最便宜的安排，不一定是社会认为最安全的安排。","评价产业政策，需要同时问：哪些环节真的具有战略性？成本由谁承担？产业能否逐步提高效率？有没有比全面回流更低成本的多元化方案？对企业来说，韧性往往意味着避免单点故障，而不是追求所有东西都自己生产。"],"en":["Relocating production of critical goods can reduce some geopolitical risks and create local jobs. But factories depend on equipment, components, talent, energy and logistics networks that cross borders. Moving final assembly does not make a supply chain fully domestic.","Local manufacturing may face higher labor, land or compliance costs, while subsidies consume public resources. Yet spare capacity and supplier diversification can have insurance value during disruption. The cheapest normal-time arrangement need not be the most resilient one.","Good industrial policy asks which links are genuinely strategic, who pays, whether productivity can improve, and whether diversified suppliers would offer similar security at lower cost. For businesses, resilience is often about removing single points of failure, not producing every component in-house."]},"point":{"zh":"效率追求最低成本，韧性追求减少灾难性中断；两者需要权衡。","en":"Efficiency minimizes routine cost; resilience reduces catastrophic disruption."},"terms":[["Industrial policy","产业政策"],["Reshoring","制造业回流"],["Resilience","供应链韧性"]],"source":"https://www.unido.org/"},{"id":"economic-history","category":"history","title":{"zh":"1929和2008，两次危机有什么共同教训？","en":"What 1929 and 2008 Teach About Financial Crises"},"deck":{"zh":"时代不同，但金融脆弱性与信心崩塌常有相似机制。","en":"Different eras reveal recurring problems with leverage and confidence."},"sections":{"zh":["1929年股市崩盘与此后大萧条，并不是一件事情的两个名字：金融冲击、银行倒闭、政策反应、需求萎缩和国际金本位约束相互作用，最终造成更广泛的经济灾难。2008年危机则围绕房地产信贷、证券化产品和全球金融机构的脆弱联系展开。","两个时代的制度环境截然不同，但都提醒我们：看似稳定的时期可能积累过度杠杆；当许多主体同时尝试抛售资产或保存现金，个体理性的自保会共同造成流动性紧缩。风险还会通过金融中介传播到原本看似无关的家庭与企业。","历史不提供可机械套用的“下一次危机公式”。我们能借鉴的，是重视透明资产负债表、存款体系的信任、审慎监管和危机处置能力。每次危机的导火索可能不同，但脆弱结构值得提前识别。"],"en":["The 1929 crash and the Great Depression are not identical events: financial shocks, bank failures, policy responses, collapsing demand and gold-standard constraints interacted to produce a prolonged disaster. The 2008 crisis centered on housing finance, securitized assets and fragile links among major financial institutions.","Institutions differed enormously between the two eras. Still, both highlight how leverage can build during apparently stable times. When many actors try to sell assets or hold cash simultaneously, individually rational behavior can create a system-wide liquidity squeeze. Financial transmission then affects households and businesses far from the original shock.","History does not supply a mechanical formula for the next crisis. Its durable lessons concern balance-sheet transparency, confidence in banking, prudent supervision and the capacity to respond under stress. Triggers change; fragility deserves attention before the panic."]},"point":{"zh":"金融危机的危险，常在“大家都很放心”的日子里悄悄累积。","en":"Financial fragility often accumulates during periods that feel reassuringly stable."},"terms":[["Bank run","银行挤兑"],["Systemic risk","系统性风险"],["Liquidity crisis","流动性危机"]],"source":"https://www.federalreservehistory.org/"},{"id":"market-government","category":"ideas","title":{"zh":"市场和政府，究竟谁更懂经济？","en":"Markets or Governments: Who Knows Best?"},"deck":{"zh":"现实问题往往不是二选一，而是谁知道什么、承担什么风险。","en":"The useful question is which institutions solve which coordination problems."},"sections":{"zh":["市场价格把分散的供需信息压缩成信号，鼓励企业和消费者调整行为。这种机制对大量商品和服务的日常配置非常有效。但价格也可能漏掉外部成本，比如污染；或者在公共卫生、基础科研等领域，私人收益不足以激励社会需要的投入。","政府能通过公共服务、税收、规则和投资弥补部分市场失灵，却同样面对信息不足、激励扭曲和执行能力有限的问题。一项政策即使目标合理，设计和实施也可能造成意外后果。","比抽象争论“应该全部市场化还是全部政府管”更实际的，是逐个问题检验：有没有真正的市场失灵？政策能否比现状改善？执行成本与问责机制是什么？是否存在更简单、更可逆的方案？经济学的价值正在于帮助比较这些不完美选择。"],"en":["Market prices compress dispersed information about supply and demand into signals that guide millions of decisions. The mechanism works well for many everyday goods and services. But prices can omit external costs such as pollution, and private incentives may underprovide activities like basic research or some public-health protections.","Governments can use public services, taxation, regulation and investment to address failures. They also confront limited information, distorted incentives and weak implementation capacity. A sensible policy objective does not guarantee a sensible outcome.","Instead of choosing between “all market” and “all state,” examine each case: is there a specific market failure? Can intervention improve the outcome? What are the costs, accountability mechanisms and unintended consequences? Are simpler or reversible options available? Economics helps compare imperfect institutions rather than promise a perfect one."]},"point":{"zh":"经济学最有用的回答，往往不是站队，而是识别具体的失灵与代价。","en":"Economics is most useful when it identifies concrete failures and trade-offs."},"terms":[["Market failure","市场失灵"],["Public goods","公共物品"],["Incentives","激励机制"]],"source":"https://www.core-econ.org/"},{"id":"chart-literacy","category":"data","title":{"zh":"一张经济图表，最容易骗过人的五个地方","en":"Five Ways an Economic Chart Can Mislead"},"deck":{"zh":"识图能力，是普通人理解宏观新闻最便宜的装备。","en":"A few checks can prevent common mistakes when reading economic data."},"sections":{"zh":["第一看纵轴是否从零开始：截断坐标有时有分析价值，但会放大视觉差异。第二看时间窗口：选择某一段快速上涨期，可能掩盖更长周期的反转。第三看名义与实际：未扣除通胀的收入数据可能夸大生活改善。","第四要辨别“总量”和“人均”，以及平均值和中位数。第五是相关与因果：两条线同时上升，不代表一条导致另一条。还要留意数据修订、季节调整、调查样本和口径变更，这些都会影响结论。","拿到一张图时，先找到原始来源与指标定义，再做最少五个检查：单位、分母、起止日期、价格调整、对照组。图表可以告诉你“发生了什么”，但未必能单独解释“为什么发生”。"],"en":["First inspect the vertical axis: a truncated scale can exaggerate visual differences. Second, check the time window; a short surge may disappear in a longer history. Third, distinguish nominal figures from inflation-adjusted values.","Fourth, separate totals from per-capita measures and averages from medians. Fifth, do not confuse correlation with causation. Revisions, seasonal adjustment, sampling and changed definitions can all affect the interpretation of a series.","When a chart appears persuasive, trace it to the original data and run five checks: units, denominator, start and end dates, price adjustment and comparison group. A chart may tell you what happened without explaining why it happened. Visual clarity is not the same thing as causal evidence."]},"point":{"zh":"先查指标定义，再问因果关系，不要让漂亮的曲线替你思考。","en":"Check definitions before drawing causal conclusions from beautiful lines."},"terms":[["Real vs nominal","实际与名义"],["Median","中位数"],["Causality","因果关系"]],"source":"https://ourworldindata.org/"},{"id":"global-poverty","category":"development","title":{"zh":"为什么有些国家增长几十年，仍很难变富？","en":"Why Catch-Up Growth Is Hard"},"deck":{"zh":"资本积累、制度、基础设施与全球分工交织在一起。","en":"Development depends on much more than adding machines."},"sections":{"zh":["低收入经济体可以通过投资道路、电力、教育与设备提高生产能力，但早期追赶速度未必能长期保持。随着容易复制的技术和项目被采用，增长需要逐渐转向创新、更好的管理和制度协调。","企业能否扩大规模，还取决于可靠的电力、融资、法治、运输以及足够大的市场。一个工人接受了培训，如果周围缺少设备、订单和组织能力，技能也难以变成更高收入。贸易可以提供规模和知识扩散机会，却也会暴露产业脆弱性。","发展不是一个国家“穷人不够努力”的故事。它包含大量需要集体协调的问题。看发展战略时，可以检查生产率、儿童健康、学习质量、基础设施质量与制度执行，而不能只靠某一年GDP的高增速判断成功。"],"en":["Lower-income economies can increase productive capacity through roads, electricity, education and equipment. But easy early gains do not necessarily continue forever. As technologies and projects are adopted, further progress relies increasingly on innovation, management and coordination.","Firms also need reliable power, finance, transport, rules and access to sufficiently large markets. Training a worker may produce little extra income if businesses lack machines, customers and organization. Trade offers scale and knowledge diffusion while also exposing fragile industries to competition.","Development is not a story about individuals failing to work hard enough. Many obstacles are collective-action problems. Look at productivity, child health, learning outcomes, infrastructure reliability and institutional capability—not one year's headline GDP growth alone."]},"point":{"zh":"长期发展是组织能力、公共基础设施与私人创新的共同结果。","en":"Development emerges from institutions, public infrastructure and private innovation together."},"terms":[["Capital accumulation","资本积累"],["Institutions","制度"],["Productivity catch-up","生产率追赶"]],"source":"https://www.worldbank.org/en/topic/development"},{"id":"pension-puzzle","category":"policy","title":{"zh":"养老金从哪里来？一笔跨越几十年的交换","en":"Where Does Retirement Income Really Come From?"},"deck":{"zh":"制度形式不同，但退休生活终究依赖未来的真实产出。","en":"Regardless of the financing model, retirees consume future goods and services."},"sections":{"zh":["退休制度有现收现付、个人账户和企业年金等多种形式。现收现付强调当期缴费者对当期领取者的支持；积累型安排则通过持有金融资产，获得未来的支付能力。两种机制的财务安排不同，却都需要未来社会持续生产商品和服务。","当寿命延长、退休人口占比上升，制度必须在缴费率、退休年龄、待遇增长、财政补贴和投资收益之间做选择。不存在不受人口与经济约束的“免费养老金”。但这也不意味着老龄化一定导致制度崩溃：就业参与和生产率改善可以改变承受能力。","个人需要了解自己的法定待遇、缴费记录、通胀风险和私人储蓄，而不应把高收益承诺视为解决养老的捷径。公共政策则应追求制度透明、跨代可持续和对弱势老年人的基本保障。"],"en":["Retirement systems may rely on pay-as-you-go transfers, individual funded accounts or occupational pensions. Their accounting structures differ. Yet in every arrangement, retirees ultimately consume goods and services produced by a future economy. Financial claims alone cannot bake bread or deliver medical care.","Longer lives and a larger retired population force choices involving contributions, eligibility ages, benefits, taxes and returns. There is no pension arrangement free from economic and demographic constraints. But ageing does not guarantee collapse: participation and productivity can change affordability.","Individuals should understand legal entitlements, contribution records, inflation exposure and personal savings. Extraordinary return promises are not a credible pension strategy. Public design should emphasize transparency, intergenerational sustainability and a basic safety net for vulnerable older people."]},"point":{"zh":"养老金既是财务承诺，也是关于未来社会产出如何分配的承诺。","en":"A pension is both a financial promise and a claim on future social production."},"terms":[["Pay-as-you-go","现收现付"],["Funded pension","积累型养老金"],["Replacement rate","养老金替代率"]],"source":"https://www.oecd.org/en/topics/pensions.html"},{"id":"tax-public-service","category":"policy","title":{"zh":"我们交的税，怎样变成看得见的公共服务？","en":"How Taxes Become Public Services"},"deck":{"zh":"税收不只是“拿走收入”，还决定城市能够共同完成什么。","en":"Taxes fund shared capacity, but accountability determines trust."},"sections":{"zh":["税收为道路、教育、卫生、司法、安全和社会保障提供资金。没有这些公共服务，许多私人交易的成本反而会更高。不过政府支出并非越多越好：同一笔钱可能带来有用的基础设施，也可能因为浪费和选择失误而效率低下。","分析财政，至少要区分税收负担、预算结构和服务质量。税负相同的两个地区，居民体验可以完全不同；同一项支出也可能在短期创造就业，在长期留下维护费用或债务负担。","普通人理解财政，可以从地方预算入手：钱从哪里来？花在谁身上？有哪些可以衡量的结果？工程竣工与公共服务改善之间，也需要可检验的证据。透明、审计和问责能提高公共支出的可信度。"],"en":["Taxes finance roads, education, healthcare, justice, safety and social protection. Without these services, many private transactions would become more expensive or impossible. Yet more spending does not automatically mean better outcomes: projects can create value or waste resources through poor design and execution.","Fiscal analysis should distinguish the tax burden, the composition of budgets and the quality of services. Two places with similar taxes can offer radically different experiences. A public investment may create jobs now while generating maintenance obligations or debt later.","Citizens can begin with local budgets: where does money come from, who benefits, and what outcomes can be measured? Completing a project is not identical to improving a service. Transparency, auditing and accountability make the link between payment and public value more credible."]},"point":{"zh":"好财政要回答的不仅是“花了多少”，更是“改善了什么”。","en":"Good budgeting asks not just how much was spent, but what improved."},"terms":[["Fiscal policy","财政政策"],["Public spending","公共支出"],["Accountability","问责"]],"source":"https://www.imf.org/en/Topics/fiscal-policies"},{"id":"scarcity-ai","category":"technology","title":{"zh":"当软件几乎免费生产，什么会越来越稀缺？","en":"When Software Becomes Cheap, What Becomes Scarce?"},"deck":{"zh":"自动化降低部分成本，却可能抬高注意力、信任和现实交付的价值。","en":"Abundant digital output can make trust and real-world execution more valuable."},"sections":{"zh":["生成式AI降低了写代码、做图、撰写初稿的部分门槛。理论上，当一种产出更容易复制，其单件价格就可能受到竞争压力。但这不表示所有与它有关的劳动都会失去价值：需求可能扩张，也可能出现新的互补工作。","大量内容和软件涌现后，筛选可靠信息、连接真实需求、验证质量以及对结果承担责任，可能比“能否生产一份东西”更有区分度。线下服务、受监管行业和需要物理资源的工作，也不一定随数字内容一起降价。","对于个人和企业，关键是寻找稀缺的互补能力：准确理解客户问题、拥有可信渠道、掌握专门知识、进行现实部署与长期维护。技术降低了创作门槛，却没有消除商业中的交付与信任问题。"],"en":["Generative AI can reduce the cost of producing code, visuals and drafts. When outputs become easier to replicate, competition may compress the price of each unit. But demand may expand, and complementary human tasks can grow rather than disappear.","As digital material becomes abundant, selecting reliable information, matching it to genuine needs, verifying quality and taking responsibility for outcomes can become more valuable. Physical services, regulated activities and infrastructure-dependent work need not follow digital content down the same cost curve.","Individuals and firms should identify scarce complementary capabilities: understanding customers, building trusted distribution, applying specialized knowledge, deploying tools in the real world and maintaining results. Lower creation costs do not eliminate the economics of service, judgment and trust."]},"point":{"zh":"越容易批量生成，越要竞争判断、信任、分发与真实交付。","en":"As production becomes abundant, judgment, trust, distribution and delivery gain importance."},"terms":[["Marginal cost","边际成本"],["Complementarity","互补性"],["Trust","信任"]],"source":"https://www.oecd.org/en/topics/artificial-intelligence.html"},{"id":"logistics-strait","category":"global","title":{"zh":"为什么一条海峡拥堵，全球商品都可能涨价？","en":"How a Shipping Bottleneck Reaches Your Shopping Cart"},"deck":{"zh":"全球贸易的效率，建立在一套极其紧密的交通与库存系统上。","en":"Global supply chains depend on transport capacity, inventories and time."},"sections":{"zh":["远洋运输通过巨大的规模经济降低单位商品运费，但运输网络依赖港口、航道、船队和保险。当关键通道中断，货船绕行不仅增加燃料费，还会占用更多船舶和集装箱时间，推高整个系统的运力成本。","商品最终涨价多少，取决于运费在产品成本中占多大比例、企业库存有多少、能否找到替代线路以及零售商的定价能力。轻薄高价值商品和低价值大体积商品的敏感度不同。延误也可能使企业缺少零件，而不仅是增加账单。","从家庭视角看，这说明“供应链韧性”不是抽象口号；从企业视角看，合理库存、备用供应商和运输路线组合可以降低极端中断损失，但平时也要付出额外成本。最便宜与最可靠往往需要折中。"],"en":["Ocean shipping reduces unit transport costs through scale, but depends on ports, canals, vessels, insurance and scheduling. When a critical passage is disrupted, detours use more fuel and keep ships and containers occupied longer, tightening effective transport capacity elsewhere in the network.","The final effect on retail prices depends on freight's share of the product cost, inventories, alternative routes and pricing power. Bulky low-value goods may be more freight-sensitive than compact expensive goods. Delays can also halt production when a missing component matters more than its purchase price.","For households, supply-chain resilience is a practical influence on availability and cost. For firms, inventory buffers, alternate suppliers and diversified routes can reduce the impact of severe disruption, but they also impose ongoing expense. Reliability is a form of insurance, not a free lunch."]},"point":{"zh":"全球化降低了常态成本，也把遥远的物流瓶颈连接到你身边。","en":"Globalization lowers routine costs while transmitting distant logistics shocks."},"terms":[["Freight rate","运价"],["Inventory","库存"],["Bottleneck","运输瓶颈"]],"source":"https://unctad.org/topic/transport-and-trade-logistics"},{"id":"why-prices-rise","category":"business","title":{"zh":"为什么咖啡、外卖和理发的价格越涨越快？","en":"Why Service Prices Can Be Stubborn"},"deck":{"zh":"服务业涨价，常常有一套不同于制造业的逻辑。","en":"Labor-intensive services face a different productivity challenge from factories."},"sections":{"zh":["制造业可以通过自动化和规模生产，让每小时制造更多产品。但理发、护理、餐饮服务往往需要面对面时间，很难无限压缩。即便服务人员效率变化有限，也要在竞争劳动力的市场里支付足够工资。这样的结构性压力常被称作“鲍莫尔成本病”。","这并不意味着服务业完全不能提高生产率。在线预约、排班系统、标准化流程和更好的设备都可能改善效率。不同地区的房租、平台抽成和人员流动，也会对服务价格产生重要影响。","当看到服务价格上涨，不要只用“商家贪心”解释。可以分解劳动力、场地、原材料、获客与税费，再比较服务质量和效率有无变化。对于消费者，价格高低与是否值得购买是两个不同的问题。"],"en":["Factories can produce more goods per hour through automation and scale. Haircuts, caregiving and restaurant service often still require human time that cannot be compressed indefinitely. Even if productivity in these activities grows slowly, employers must compete for workers and pay viable wages. This is part of the intuition behind Baumol's cost disease.","Service productivity can still improve through scheduling software, standardized processes, better equipment and organization. Rent, platform fees and worker turnover matter too, making costs highly local.","When a service becomes more expensive, “greedy sellers” is not a complete diagnosis. Examine labor, property, materials, customer acquisition, taxes and changes in quality. Whether a service is costly to produce and whether it is worth buying are separate questions."]},"point":{"zh":"生产率变化慢的服务，也会被全社会工资与土地成本推着涨价。","en":"Slow-productivity services still compete for labor and urban space."},"terms":[["Baumol effect","鲍莫尔效应"],["Service productivity","服务业生产率"],["Labor cost","劳动力成本"]],"source":"https://www.bls.gov/productivity/"}];

function graphic(){return `<div class="hero-art" aria-label="Abstract economic data illustration"><div class="art-grid"></div><div class="art-text">DATA / IDEAS / EVERYDAY LIFE</div><svg viewBox="0 0 550 430" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract data visualization" xmlns="http://www.w3.org/2000/svg"><circle cx="335" cy="181" r="127" fill="none" stroke="#87acaa" opacity=".5" stroke-width="1.5"/><circle cx="335" cy="181" r="100" fill="none" stroke="#9bb5ad" stroke-dasharray="3 7" stroke-width="1.4"/><circle cx="335" cy="181" r="60" fill="#d98b70" opacity=".94"/><circle cx="335" cy="181" r="32" fill="#ecb29a" opacity=".6"/><path d="M108 305L171 259L214 274L259 210L304 236L361 133L407 173L475 74" fill="none" stroke="#f4cf9e" stroke-width="5" stroke-linecap="square"/><path d="M108 305L171 259L214 274L259 210L304 236L361 133L407 173L475 74" fill="none" stroke="#f4cf9e" stroke-width="1.4" stroke-dasharray="1 2"/><g fill="#f2c5ad"><circle cx="108" cy="305" r="5"/><circle cx="259" cy="210" r="5"/><circle cx="361" cy="133" r="5"/><circle cx="475" cy="74" r="5"/></g><g fill="#7b9294" opacity=".65"><rect x="114" y="338" width="27" height="70"/><rect x="150" y="315" width="27" height="93"/><rect x="186" y="349" width="27" height="59"/><rect x="222" y="290" width="27" height="118"/><rect x="258" y="322" width="27" height="86"/><rect x="294" y="280" width="27" height="128"/><rect x="330" y="303" width="27" height="105"/><rect x="366" y="253" width="27" height="155"/><rect x="402" y="282" width="27" height="126"/></g><text x="115" y="98" fill="#c1d3cf" font-size="13" font-family="serif">01 — 27</text><text x="468" y="220" fill="#c1d3cf" font-size="13" font-family="serif">↗</text><path d="M88 360H482M88 243H482M88 126H482" stroke="#b9c8c4" stroke-width=".6" opacity=".37"/></svg><div class="art-bottom"><strong>THE INVISIBLE<br/>ECONOMY</strong><small>VOL. I<br/>A NEW WAY OF SEEING</small></div></div>`}

ss="topic-strip" id="topic-strip" aria-label="Article categories"></div><div class="catalog-bar"><label class="search-shell"><span>⌕</span><input type="search" autocomplete="off" id="search-input" aria-label="Search articles" placeholder="${tr('搜索文章、经济学概念、中英文关键词…','Search articles, concepts, English or Chinese…')}" value="${H(search)}"><button type="button" id="clear-search" aria-label="Clear search">×</button></label><div class="catalog-meta" id="catalog-count"></div></div><div class="card-grid" id="article-grid"></div><div class="load-row"><button class="more-btn" id="show-more" type="button">${tr('加载更多文章 ↓','LOAD MORE ↓')}</button></div></section><section class="source-band" id="sources"><div class="wrap"><div><div class="eyebrow" style="color:#e1b7a6">A BETTER WAY TO LEARN</div><h2>${tr('从观点，回到原始数据。','Start with primary sources.')}</h2><p>${tr('杂志文章是独立撰写的解释性内容，下面提供权威机构的数据与研究入口，便于延伸核验。这里不自动抓取实时行情，也不把旧数据伪装成今日新闻。','Our features are independent educational explainers. These institutions offer original data and research for verification. This edition does not claim to display live market quotes or automatically updated news.')}</p></div><div class="source-grid">${sources.map(s=>`<a href="${s[2]}" target="_blank" rel="noopener noreferrer">${H(tr(s[0],s[1]))}<span>↗</span></a>`).join('')}</div></div></section></main>${footer()}`}
function currentFilter(){const input=(search||'').trim().toLowerCase();return A.filter(a=>{if(selectedView==='saved'&&!getFav().includes(a.id))return false;if(selectedView==='read'&&!getReads().includes(a.id))return false;if(selectedCat!=='all'&&a.category!==selectedCat)return false;if(!input)return true;return input.split(/\s+/).every(q=>[a.title.zh,a.title.en,a.deck.zh,a.deck.en,catName(a.category),...a.sections.zh,...a.sections.en,...a.terms.flat()].join(' ').toLowerCase().includes(q))})}
function updateFilters(){const el=document.querySelector('#topic-strip');if(!el)return;const top=[`<button class="topic-chip ${selectedView==='all'&&selectedCat==='all'?'active':''}" data-cat="all" data-view="all">${tr('全部文章','All stories')}</button>`,`<button class="topic-chip ${selectedView==='saved'?'active':''}" data-view="saved">☆ ${tr('我的收藏','Saved')}</button>`,`<button class="topic-chip ${selectedView==='read'?'active':''}" data-view="read">✓ ${tr('已读','Read')}</button>`];Object.keys(cats).forEach(k=>top.push(`<button class="topic-chip ${selectedView==='all'&&selectedCat===k?'active':''}" data-cat="${k}" data-view="all">${catName(k)}</button>`));el.innerHTML=top.join('')}
function updateGrid(){const el=document.querySelector('#article-grid');if(!el)return;const results=currentFilter();el.innerHTML=results.length?results.slice(0,limit).map(a=>card(a,A.indexOf(a))).join(''):`<div class="empty">${tr('这里暂时没有匹配的文章。试试别的关键词或分类。','No matching stories. Try another search or category.')}</div>`;const count=document.querySelector('#catalog-count');if(count)count.textContent=tr(`共 ${results.length} 篇文章 · 2026年10月创刊号`,`${results.length} stories · October 2026 inaugural issue`);const more=document.querySelector('#show-more');if(more)more.hidden=results.length<=limit;const clear=document.querySelector('#clear-search');if(clear)clear.style.display=search?'inline':'none'}
function homeEvents(){updateFilters();updateGrid();const input=document.querySelector('#search-input');if(input){input.addEventListener('input',()=>{search=input.value;limit=12;updateGrid()});document.querySelector('#clear-search').addEventListener('click',()=>{search='';input.value='';updateGrid();input.focus()})}document.querySelector('#show-more')?.addEventListener('click',()=>{limit+=12;updateGrid()})}
function articleContent(a){const hs=[tr('先看现象','The pattern'),tr('背后的经济机制','The economic mechanism'),tr('这对我们意味着什么','What this means')];const body=a.sections[lang];return body.map((p,i)=>`<h2 id="sec-${i+1}">${String(i+1).padStart(2,'0')} · ${hs[i]}</h2><p>${H(p)}</p>`).join('')}
function articleHTML(a,homeTitle=true){const ids=A.indexOf(a),more=[A[(ids+1)%A.length],A[(ids+7)%A.length]];return `${homeTitle?brand():''}<div class="reader-progress" id="reader-progress"></div><main class="wrap reader-wrap"><div class="breadcrumbs"><a href="${homeHref()}">${tr('首页','Home')}</a><b>/</b><a href="${homeHref()}#archive">${tr('文章目录','Archive')}</a><b>/</b><span>${catName(a.category)}</span></div><div class="reader-columns"><article id="article-body"><div class="eyebrow">${catName(a.category)} / THE IN-DEPTH READ</div><h1 class="article-title">${H(title(a))}</h1><p class="article-deck">${H(deck(a))}</p><div class="reader-meta"><span>ECONOMY ATLAS · NO. 001</span><span>2026.10.26</span><span>${est(a)} ${tr('分钟阅读','min read')}</span><span>${tr('原创双语','Bilingual original')}</span></div><div class="reader-tools"><button data-action="fav" data-id="${a.id}" id="reader-fav">${getFav().includes(a.id)?'★ '+tr('已收藏','Saved'):'☆ '+tr('收藏文章','Save story')}</button><button data-action="copy" data-id="${a.id}">↗ ${tr('复制链接','Copy link')}</button><button data-action="font-minus" aria-label="Decrease font size">A−</button><button data-action="font-plus" aria-label="Increase font size">A+</button><button data-action="speak">▷ ${tr('朗读','Listen')}</button><button data-action="print">⌁ ${tr('打印','Print')}</button></div><div class="reader-content" id="reader-content">${articleContent(a)}<div class="article-callout">“${H(a.point[lang])}”</div></div><div class="reader-extra"><h3>${tr('经济学关键词','Economic vocabulary')}</h3><div class="term-list">${a.terms.map(x=>`<span class="term-pill"><strong>${H(x[0])}</strong> · ${H(x[1])}</span>`).join('')}</div><h3>${tr('延伸阅读与核验','Further research')}</h3><p class="reader-source">${tr('相关权威机构及研究入口（非本文逐句引用来源）：','Relevant institutional research gateway (not a sentence-by-sentence citation):')} <a href="${H(a.source)}" target="_blank" rel="noopener noreferrer">${H(a.source)} ↗</a></p><p class="reader-source">${tr('本文为原创经济学科普内容，不代表任何机构立场，不构成投资、法律或税务建议。','Original educational feature. It does not represent institutional positions or constitute financial, legal or tax advice.')}</p></div></article><aside class="reader-aside"><div class="aside-head">IN THIS STORY</div><ol>${[tr('先看现象','The pattern'),tr('背后的经济机制','The economic mechanism'),tr('这对我们意味着什么','What this means')].map((t,i)=>`<li><a href="#sec-${i+1}">${String(i+1).padStart(2,'0')} · ${t}</a></li>`).join('')}</ol><div class="aside-more"><div class="aside-head">KEEP READING</div>${more.map(x=>`<a href="${readHref(x.id)}">${H(title(x))} ↗</a>`).join('')}</div></aside></div><div class="article-next"><div class="section-heading"><div><div class="mini">EXPLORE MORE IDEAS</div><h2>${tr('接着读','Read next')}</h2></div><button class="back-top" data-action="back-top">↑ ${tr('返回顶部','Back to top')}</button></div><div class="card-grid">${more.map(x=>card(x,A.indexOf(x))).join('')}</div></div></main>${footer()}`}
function applyPrefs(){root.dataset.lang=lang;root.lang=lang==='zh'?'zh-CN':'en';root.dataset.theme=dark?'dark':'light';put('lang',lang);put('theme',dark?'dark':'light');const f=get('font',19);root.style.setProperty('--reading',Math.max(16,Math.min(23,Number(f)))+'px')}
function setReader(id){const a=byId[id];if(!a)return;currentId=id;let reads=getReads();if(!reads.includes(id)){reads.push(id);put('reads',reads)}document.title=title(a)+' · ECONOMY ATLAS';document.getElementById('app').innerHTML=articleHTML(a);window.scrollTo(0,0);updateProgress()}
function renderHome(){currentId=null;document.title=tr('经济切面 · 中英双语经济学杂志','Economy Atlas · The bilingual economics magazine');document.getElementById('app').innerHTML=homeHTML();homeEvents()}
function router(){if(mode!=='single')return;let h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('read/')){const id=h.slice(5);if(byId[id]){setReader(id);return}}renderHome();if(h==='saved'){selectedView='saved';selectedCat='all';updateFilters();updateGrid();document.getElementById('archive')?.scrollIntoView()}else if(h==='archive'||h==='sources'){document.getElementById(h)?.scrollIntoView()}}
function langFlip(){lang=lang==='zh'?'en':'zh';applyPrefs();if(mode==='single'){router()}else if(readerMode){const a=byId[document.body.dataset.id];if(a){const oldId=window.location.hash;const main=document.querySelector('#app');main.innerHTML=articleHTML(a,false);document.title=title(a)+' · ECONOMY ATLAS';updateProgress();if(oldId.startsWith('#sec-'))document.querySelector(oldId)?.scrollIntoView()}const h=document.getElementById('site-head');if(h)h.innerHTML=brand()}else{renderHome()}toast(tr('已切换中文','Switched to English'))}
function init(){applyPrefs();if(mode==='single'){router();addEventListener('hashchange',router)}else if(readerMode){const a=byId[document.body.dataset.id];if(a){currentId=a.id;const reads=getReads();if(!reads.includes(a.id)){reads.push(a.id);put('reads',reads)}document.title=title(a)+' · ECONOMY ATLAS';document.getElementById('site-head').innerHTML=brand();document.getElementById('app').innerHTML=articleHTML(a,false);document.getElementById('site-foot').innerHTML=footer();updateProgress()}}else renderHome();document.addEventListener('click',clicker);document.addEventListener('keydown',e=>{if((e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){const input=document.querySelector('#search-input');if(input){e.preventDefault();input.focus();input.select()}}});window.addEventListener('scroll',()=>{if(currentId)updateProgress()},{passive:true})}
function clicker(e){const fav=e.target.closest('[data-fav]');if(fav){e.preventDefault();toggleFav(fav.dataset.fav);return}const chip=e.target.closest('[data-view]');if(chip){e.preventDefault();selectedView=chip.dataset.view;selectedCat=chip.dataset.cat||'all';limit=12;updateFilters();updateGrid();return}const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;
if(action==='theme'){dark=!dark;applyPrefs();if(mode==='single')router();else if(readerMode)document.getElementById('site-head').innerHTML=brand();else renderHome()}
if(action==='lang')langFlip();if(action==='home-favs'){if(mode==='single'){location.hash='#saved';if(location.hash==='#saved')router()}else location.href=homeHref()+'#saved'}
if(action==='fav')toggleFav(btn.dataset.id);if(action==='copy'){const url=mode==='single'?location.href:location.href.split('#')[0];copyText(url)}
if(action==='font-minus'||action==='font-plus'){let f=Number(get('font',19))+(action==='font-plus'?1:-1);f=Math.max(16,Math.min(23,f));put('font',f);applyPrefs();toast(tr('字号已调整','Text size updated'))}
if(action==='speak')speak(btn);if(action==='print')window.print();if(action==='back-top')scrollTo({top:0,behavior:'smooth'})}
function toggleFav(id){let favs=getFav();favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];put('favs',favs);toast(favs.includes(id)?tr('已加入收藏','Added to bookmarks'):tr('已取消收藏','Bookmark removed'));if(currentId){const b=document.querySelector('#reader-fav');if(b){b.textContent=favs.includes(id)?'★ '+tr('已收藏','Saved'):'☆ '+tr('收藏文章','Save story')}document.querySelectorAll(`[data-fav="${id}"]`).forEach(x=>{x.textContent=favs.includes(id)?'★':'☆';x.classList.toggle('on',favs.includes(id))})}else updateGrid()}
function copyText(value){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(()=>toast(tr('链接已复制','Link copied'))).catch(()=>fallbackCopy(value))}else fallbackCopy(value)}
function fallbackCopy(value){const box=document.createElement('textarea');box.value=value;box.style.position='fixed';box.style.opacity='0';document.body.appendChild(box);box.select();try{document.execCommand('copy');toast(tr('链接已复制','Link copied'))}catch{toast(value)}box.remove()}
function speak(btn){if(!('speechSynthesis' in window)){toast(tr('当前浏览器不支持朗读','Read-aloud not supported'));return}const synth=window.speechSynthesis;if(synth.speaking){synth.cancel();btn.textContent='▷ '+tr('朗读','Listen');return}const a=byId[currentId];if(!a)return;const u=new SpeechSynthesisUtterance([title(a),...a.sections[lang],a.point[lang]].join('。'));u.lang=lang==='zh'?'zh-CN':'en-US';u.rate=lang==='zh'?.92:.90;u.onend=()=>btn.textContent='▷ '+tr('朗读','Listen');u.onerror=()=>btn.textContent='▷ '+tr('朗读','Listen');synth.speak(u);btn.textContent='■ '+tr('停止','Stop')}
function updateProgress(){const bar=document.querySelector('#reader-progress');if(!bar)return;const el=document.getElementById('article-body');if(!el)return;const top=el.getBoundingClientRect().top+scrollY,range=Math.max(1,el.scrollHeight-innerHeight*.75),p=Math.min(1,Math.max(0,(scrollY-top)/range));bar.style.width=(p*100).toFixed(1)+'%'}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script></body></html>
