function launch(key){const mk=sha256(concat(key,utf8Encode("dc-mac-v1")));if(!eq(expected,hmac(mk,concat(nonce,cipher))))throw Error("内容校验失败");const page=utf8Decode(crypt(cipher,key,nonce));document.open();document.write(page);document.close()}
function normalizeCode(v){let x=v.toUpperCase().replace(/[^A-Z0-9]/g,"");if(x.startsWith("DC")&&x.length===18){x=x.slice(2);return"DC-"+x.match(/.{4}/g).join("-")}return v.toUpperCase().replace(/\s+/g,"").trim()}
function keyFromCode(code){for(const r of records){const salt=fromB64(r.s),wrapped=fromB64(r.w),tag=fromB64(r.t),wk=sha256(concat(utf8Encode(code),salt,utf8Encode("dc-invite-v1")));if(eq(tag,hmac(wk,concat(salt,wrapped,utf8Encode("wrap"))).slice(0,16))){const mask=sha256(concat(wk,salt,utf8Encode("content-key"))),key=new Uint8Array(32);for(let i=0;i<32;i++)key[i]=wrapped[i]^mask[i];return key}}return null}
function setMsg(t,ok){const m=document.getElementById("msg");m.textContent=t;m.className="msg"+(ok?" ok":"")}
(async()=>{try{const x=JSON.parse(localStorage.getItem(storeKey)||"null");if(x&&x.until>Date.now()){setMsg("正在恢复授权…",true);await new Promise(r=>setTimeout(r,80));launch(fromB64(x.key));return}else localStorage.removeItem(storeKey)}catch(e){localStorage.removeItem(storeKey)}})();
document.getElementById("gate").addEventListener("submit",async e=>{e.preventDefault();const input=document.getElementById("code"),btn=document.getElementById("go"),code=normalizeCode(input.value);input.value=code;if(!code){setMsg("请输入邀请码");return}btn.disabled=true;btn.innerHTML='<span class="spin"></span>正在验证';setMsg("");await new Promise(r=>setTimeout(r,80));try{const key=keyFromCode(code);if(!key){setMsg("邀请码不正确，请向网站主人核对");btn.disabled=false;btn.textContent="解锁课程";return}if(document.getElementById("remember").checked)localStorage.setItem(storeKey,JSON.stringify({key:toB64(key),until:Date.now()+7*86400000}));setMsg("验证成功，正在进入课程…",true);await new Promise(r=>setTimeout(r,180));launch(key)}catch(err){setMsg("暂时无法解锁，请刷新后重试");btn.disabled=false;btn.textContent="解锁课程"}});
