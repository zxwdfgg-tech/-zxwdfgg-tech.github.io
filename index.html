<script>const DATA=[{"id":1,"category":"故障诊断","title":"三相电压正常，电机为什么还会发热？","lead":"电压“看起来差不多”，不代表电机处于健康工况。电流不平衡、缺相、过载及机械阻力都可能让绕组温升异常。","points":[["先分清测量对象","在电机接线端核对三组线电压，再在稳定负载下记录三相电流。电源入口正常，不等于电机端子正常；接触器、开关、端子可能带来额外压降。"],["再计算不平衡率","用“三相数值的最大偏离平均值 ÷ 平均值 × 100%”得到电压或电流不平衡率。电压失衡可能显著放大为电流失衡。"],["最后检查负载","核实轴承、联轴器、泵阀和散热风道。不能只靠一次瞬时测量就宣布问题解决。"]],"wrong":"误区：三相都测到电压就认为绝不缺相；运行中的电机可能出现感应电压，须综合电流和设备状态判断。","sources":[["Fluke · Voltage Unbalance","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/voltage-unbalance"],["Fluke · Motor Input Troubleshooting","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/how-to-troubleshoot-motors-and-drives-starting-at-the-inputs"]],"level":"进阶","minutes":6,"keywords":"三相 电机 过热 不平衡 缺相","tag":"技术精读","date":"2026.10.22"},{"id":2,"category":"故障诊断","title":"电压不平衡率，怎么算才不容易算错？","lead":"量出三相线电压后，先求平均值，再看偏离最大的那相；不是“最大值减最小值后直接除最大值”。","points":[["计算例子","线电压 380V、390V、400V，平均 390V，最大偏差 10V，因此电压不平衡率为 10÷390×100%=2.56%。"],["看变化趋势","同一负载、同一测点、相近时刻的比较更有意义。波动负载需要记录趋势，不要只拿一个时间点决策。"],["找根因的顺序","检查电源、保护器件、接触器、端子和负载分配，必要时用合适的电能质量仪器。"]],"wrong":"误区：把电流不平衡率当成电压不平衡率，两者定义相似，但代表的故障风险不同。","sources":[["Fluke · Voltage Unbalance","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/voltage-unbalance"]],"level":"入门","minutes":4,"keywords":"电压 电流 不平衡率 计算","tag":"技术精读","date":"2026.10.22"},{"id":3,"category":"故障诊断","title":"接触器吸合后发出嗡嗡声，可能是哪几类原因？","lead":"交流接触器有轻微电磁声可能正常，明显异常振动和噪声则要结合线圈供电与机械机构判断。","points":[["先看控制电源","核对线圈铭牌电压、频率及线圈端实际供电，尤其是吸合瞬间有无明显跌落。"],["再看机械吸合","铁芯面污物、机构卡滞、衔铁不能完全贴合都可能产生噪声和发热。"],["不要忽略负载侧","触点损坏、频繁吸合、控制逻辑振荡，也可能伴随断续的声音。"]],"wrong":"误区：现场反复用手压衔铁试图消除噪声；先隔离能源，由具备资质的人员检修。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"],["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"入门","minutes":4,"keywords":"接触器 线圈 嗡嗡声 控制线路","tag":"技术精读","date":"2026.10.22"},{"id":4,"category":"故障诊断","title":"配电箱某个接线端子反复发热，先怀疑什么？","lead":"持续局部温升常与连接电阻增大有关，但也必须把导体截面、负载和环境条件一起考虑。","points":[["看工况而非只看温度","记录负载电流、环境温度、同类端子温差；红外测温结果还受发射率与反射影响。"],["分析连接风险","压接工艺不当、触头氧化、紧固力矩不匹配或多股线处理错误，都可能使接点损耗上升。"],["按作业流程处理","有异常应评估停运，执行隔离和验电后由授权人员检查；复电后再验证运行温升。"]],"wrong":"误区：不停电直接带电补拧螺丝；这可能带来电弧与触电风险。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"],["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"进阶","minutes":5,"keywords":"端子 发热 温升 接触电阻","tag":"技术精读","date":"2026.10.22"},{"id":5,"category":"故障诊断","title":"断路器偶尔跳闸，是过载还是短路？","lead":"跳闸本身只是保护动作结果，需要结合保护脱扣类型、负载时序和故障记录进行判断。","points":[["记录时间线","跳闸发生在电机启动瞬间、连续运行一段时间后，还是某设备投入时？现象往往决定排查方向。"],["核对保护曲线","热过载、瞬时短路、剩余电流保护机制不同，不能把它们混称为“空开不行”。"],["查线路与负载","量测运行电流并核对整定值、线缆能力和设备铭牌，必要时检查绝缘。"]],"wrong":"误区：直接换更大额定电流的断路器来“解决跳闸”，可能让电缆失去应有保护。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":5,"keywords":"断路器 跳闸 过载 短路","tag":"技术精读","date":"2026.10.22"},{"id":6,"category":"故障诊断","title":"漏电保护器频繁动作，能不能先拆掉？","lead":"不能以取消保护为“排故方案”。应识别是实际泄漏电流、设备故障、回路配置问题还是器件选型问题。","points":[["画清供电回路","查看中性线与保护线连接、共享中性线、上下级 RCD 配合及接地系统类型。"],["逐一隔离关联设备","由专业人员执行安全程序后，对潮湿设备、加热器、变频器等逐项核验。"],["考虑装置类型","不同电子负载可能需要不同类型的剩余电流保护装置，按照标准与制造商资料选用。"]],"wrong":"误区：把 N 线与 PE 线在负载侧随意连接，或用短接的方式绕开漏保。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"],["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"进阶","minutes":5,"keywords":"RCD 漏保 剩余电流 接地","tag":"技术精读","date":"2026.10.22"},{"id":7,"category":"故障诊断","title":"设备一启动，照明就闪一下：电压暂降怎么查？","lead":"大型电机起动电流与上游网络阻抗可能造成短时电压下降，不能只看万用表稳定显示的数字。","points":[["确认关联性","记录闪烁与设备启动时间是否一致，区分偶发暂降与持续欠压。"],["检查共用馈线","沿电源路径核实电缆、连接点、变压器容量和起动方式。"],["用合适仪器抓瞬态","万用表刷新率可能错过短暂事件，电能质量记录仪更适合抓暂降与持续时间。"]],"wrong":"误区：把每次照明闪烁都归咎于电压波动而不核实起动设备和供电容量。","sources":[["Fluke · Motor Input Troubleshooting","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/how-to-troubleshoot-motors-and-drives-starting-at-the-inputs"],["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":5,"keywords":"压降 启动 照明 闪烁","tag":"技术精读","date":"2026.10.22"},{"id":8,"category":"低压配电","title":"断路器的“选择性保护”，到底在保护什么？","lead":"理想情况下，末端出现故障时应由最接近故障点的保护器件动作，上一级保留非故障回路供电。","points":[["用生活例子理解","某个插座短路，期望分支断路器切除，不希望整栋楼总断路器跳闸。"],["选择性并非只看额定值","要联合故障电流、脱扣曲线、时间延时和制造商配合表判断。"],["看短路电流区间","有的组合仅在某个故障电流范围内实现选择性，不能笼统写“上下级额定值不同就能配合”。"]],"wrong":"误区：把“上级大、下级小”视为实现全选择性的充分条件。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":6,"keywords":"选择性 配合 级差 断路器","tag":"技术精读","date":"2026.10.22"},{"id":9,"category":"低压配电","title":"TN-S、TN-C-S、TT：接地系统怎么一眼看懂？","lead":"字母描述电源侧与设备外露导电部分的接地联系，它决定故障回路与保护措施的选择。","points":[["TN-S","中性线 N 与保护线 PE 在系统中分开敷设；故障保护需要符合相应的回路阻抗和自动切断条件。"],["TN-C-S","供电的某段采用 PEN 合一导体，之后分为 N 和 PE；分开后的处理须遵守规范。"],["TT","电气设备的接地装置通常独立于电源中性点接地装置，RCD 等故障保护措施尤其重要。"]],"wrong":"误区：在不同接地制式中复制同一套漏保和接线方案。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":5,"keywords":"TN-S TN-C-S TT 接地 PE N","tag":"技术精读","date":"2026.10.22"},{"id":10,"category":"低压配电","title":"为什么不能拿 PE 线当工作零线？","lead":"N 是正常工作电流的回路导体；PE 主要承担故障保护功能，两者混用会破坏触电防护体系。","points":[["先分角色","N 可能在正常工况承载负荷电流，PE 不应被当作日常运行的工作回路。"],["再看后果","错误的 N-PE 连接可能引起外露导电部分出现危险电位、RCD 误动作或保护失效。"],["核实线路身份","仅凭线色和现场标签不足以直接下结论，须结合接线图和检验程序确认。"]],"wrong":"误区：认为 N 与 PE 最终都“接地”，所以哪里接在一起都一样。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":4,"keywords":"N PE 零线 地线","tag":"技术精读","date":"2026.10.22"},{"id":11,"category":"低压配电","title":"三相四线制，为什么中性线也可能过载？","lead":"除了三相负载分配不均，非线性设备产生的某些谐波电流也可能在中性线上叠加。","points":[["传统三相不平衡","当三相负载并非对称，中性线会承载不平衡电流。"],["非线性负载","大量电子电源与单相非线性负载会改变波形，三次及其奇数倍谐波可能在中性线上叠加。"],["工程上怎么处理","评估负载类型、谐波、线缆截面和保护配置，不要仅靠“平均分相”判断中性线安全。"]],"wrong":"误区：觉得三相四线制的中性线电流永远比任意相线小。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":5,"keywords":"中性线 三次谐波 三相四线制","tag":"技术精读","date":"2026.10.22"},{"id":12,"category":"低压配电","title":"电缆选型，为什么不能只看载流量表？","lead":"载流量是必要条件，但敷设方式、环境温度、成束、长度及短路热稳定也会影响最终选型。","points":[["先确定设计电流","核算最大持续负载与实际运行方式，注意长期连续负荷和未来扩容。"],["再核算修正因素","温度、敷设方式、导体材料及并列回路影响散热能力。"],["最后检验压降与保护","线路较长时压降可能先成为约束，故障条件还涉及保护电器配合及导体热稳定。"]],"wrong":"误区：把某个厂商的载流量表数值直接作为所有施工环境的统一上限。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":6,"keywords":"电缆 载流量 截面积 电压降","tag":"技术精读","date":"2026.10.22"},{"id":13,"category":"低压配电","title":"漏保的 30mA 是“保证绝不触电”吗？","lead":"30mA 是常见剩余动作电流等级之一，不是人体的安全阈值，也不替代绝缘、接地和隔离措施。","points":[["理解保护边界","RCD 根据剩余电流工作，能减少部分触电风险，但不能涵盖所有电击路径。"],["按回路选型","动作电流、动作时间、器件类型和上下级协调都需要结合系统设计。"],["定期检验","测试按钮只是日常功能检查的一部分，完整检测按制造商和相应规范执行。"]],"wrong":"误区：认为装了漏保就能接触带电导体，或者认为任何情况下都会动作。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":4,"keywords":"漏保 30mA 触电","tag":"技术精读","date":"2026.10.22"},{"id":14,"category":"UPS与数据中心","title":"UPS 静态旁路和维修旁路，差别究竟是什么？","lead":"静态旁路通常由 UPS 内部电力电子切换实现，维修旁路则是为了检修时绕过 UPS 设备的外部或内部路径。","points":[["静态旁路","在满足电源条件和设备逻辑时，UPS 可将负载切至旁路电源；它不等于现场已经具备维修隔离条件。"],["维修旁路","为 UPS 维护或更换提供绕行供电路径，通常涉及互锁、开关状态与隔离确认。"],["为什么操作不能照抄","不同厂商、单机/并机、双输入/单输入及旁路同步条件差别很大。"]],"wrong":"安全提醒：这里只解释原理，不提供通用带电切换操作票；必须依据具体机型手册、现场图纸和批准方案执行。","sources":[["Eaton · UPS Maintenance Bypass Best Practices","https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/maintenance-bypass-for-ups-redundancy.html"]],"level":"进阶","minutes":6,"keywords":"UPS 旁路 维修旁路 静态旁路","tag":"技术精读","date":"2026.10.22"},{"id":15,"category":"UPS与数据中心","title":"UPS 电池容量算出来，为何续航还不准？","lead":"按“总标称能量÷负载功率”只能做粗估，实际续航还受放电倍率、温度、老化、逆变效率影响。","points":[["区分额定容量与可用能量","电池 Ah 容量与电压、放电时间、截止电压有关，不能直接把所有标称 Wh 全部当作可用。"],["考虑整套系统","直流母线范围、串并联配置、UPS 效率与电池厂商恒功率放电数据都影响结果。"],["按设计裕量校验","以厂商电池放电曲线和 UPS 选型工具为依据，定期核对电池健康状态。"]],"wrong":"误区：不核对放电倍率就用“电池数量 × 电压 × Ah ÷ kW”承诺准确续航。","sources":[["Eaton · UPS Maintenance Bypass Best Practices","https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/maintenance-bypass-for-ups-redundancy.html"]],"level":"进阶","minutes":6,"keywords":"UPS 蓄电池 续航 AH 放电","tag":"技术精读","date":"2026.10.22"},{"id":16,"category":"UPS与数据中心","title":"A 路失电，ATS、柴发、UPS 谁先做什么？","lead":"它们不是同一种设备：UPS 维持关键负载不断电，ATS 切换合格电源，柴油发电机需要经历启动和建压。","points":[["用时间轴理解","市电异常时 UPS 的储能承担过渡供电；发电机满足电压和频率条件后，转换装置按设计进行供电转移。"],["分清职责","ATS 不储能，柴发不能天然实现毫秒级供电，UPS 也不代替长期燃料供能。"],["方案取决于系统结构","双电源、自投逻辑、互锁及重要负载范围需要按具体一次图与控制方案审查。"]],"wrong":"误区：假定所有 ATS 都按固定秒数完成转换，忽略机械互锁和电源合格判据。","sources":[["Eaton · UPS Maintenance Bypass Best Practices","https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/maintenance-bypass-for-ups-redundancy.html"],["Uptime Institute · Tier Classification","https://uptimeinstitute.com/tiers"]],"level":"入门","minutes":5,"keywords":"ATS 柴油发电机 UPS 双电源","tag":"技术精读","date":"2026.10.22"},{"id":17,"category":"UPS与数据中心","title":"双路市电就是“双重保险”吗？","lead":"要判断两路电源是否真正独立，不仅要数进线开关，还要追溯上游变电站、母线、保护及电缆路径。","points":[["识别共因故障","两条线路如果共享关键上游设备，单点故障仍可能同时影响两路。"],["看切换与容量","备路容量、并行运行方式与切换时间，决定故障场景下能保多少负载。"],["演练要重视边界","测试方案应考虑控制逻辑、拒动、误动、保护配合和回切条件。"]],"wrong":"误区：看到两只进线断路器就认定系统已经不存在单点故障。","sources":[["Uptime Institute · Tier Classification","https://uptimeinstitute.com/tiers"],["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":6,"keywords":"双电源 双路 母联 自投","tag":"技术精读","date":"2026.10.22"},{"id":18,"category":"UPS与数据中心","title":"数据中心 Tier III，不等于“永远不会断电”","lead":"Tier III 的关键是基础设施的并发可维护性，不能简单理解成某个固定年停电时长承诺。","points":[["先看定义","Tier III 强调冗余容量组件和多条供电或制冷路径，使规划维护可在不中断 IT 运行的条件下完成。"],["不是单靠 UPS 台数","电力、制冷、控制、布线及运行方案等都需要配合。"],["等级不是运维免疫证","人员操作、管理流程、共因风险仍需独立治理。"]],"wrong":"误区：仅凭“有 2N UPS”就向客户宣称整个数据中心达到 Tier III。","sources":[["Uptime Institute · Tier Classification","https://uptimeinstitute.com/tiers"]],"level":"进阶","minutes":5,"keywords":"Tier III 数据中心 可维护性","tag":"技术精读","date":"2026.10.22"},{"id":19,"category":"UPS与数据中心","title":"机房 PDU、列头柜、UPS 三者怎么分工？","lead":"把供电链路画成“上游电源→UPS→下游配电→IT 设备”，各层职责就清楚了。","points":[["UPS","提供电能质量保障和一定时间的备用能源，通常处于关键电力路径上。"],["列头柜或配电柜","将上级电源分配到多个支路并提供必要的保护与监测。"],["机柜 PDU","在服务器机柜内分配电源，有些型号支持计量、告警和远程控制。"]],"wrong":"误区：以为 PDU 自带 UPS 电池，或者以为装了 UPS 就无需末端保护。","sources":[["Eaton · UPS Maintenance Bypass Best Practices","https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/maintenance-bypass-for-ups-redundancy.html"],["Uptime Institute · Tier Classification","https://uptimeinstitute.com/tiers"]],"level":"入门","minutes":4,"keywords":"PDU 机房 列头柜 UPS","tag":"技术精读","date":"2026.10.22"},{"id":20,"category":"安全规程","title":"停电以后为什么还必须验电？","lead":"“控制开关在分位”并不等同于“所有可能能源已经隔离”，更不能替代现场确认无电。","points":[["识别全部能源","除了主电源，考虑双电源、发电机、UPS、光伏、储能及电容残余能量。"],["建立隔离边界","按批准的工作程序停运、隔离、锁定/挂牌并核对对应设备。"],["验证而不是猜测","由具备资质的人员使用适当等级且经过功能确认的验电装置实施验证。"]],"wrong":"安全提醒：这是安全理念说明，不可替代当地法定工作票、操作票、接地与监护要求。","sources":[["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"],["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":5,"keywords":"停电 验电 锁定挂牌 LOTO","tag":"技术精读","date":"2026.10.22"},{"id":21,"category":"安全规程","title":"挂牌锁定 LOTO 到底在防什么？","lead":"它防的是检修中设备被意外送电、启动，或储存能量突然释放，不只是“贴一张写着有人工作的纸”。","points":[["锁定能源隔离点","确保相关能源隔离装置不会被他人随意恢复。"],["通知与分工","明确授权人员、受影响人员、班组交接和特殊情形流程。"],["验证零能量","电、机械、气压、液压和储能等都可能危及检修人员。"]],"wrong":"误区：仅靠群消息说“别送电”，没有符合现场要求的隔离与锁定措施。","sources":[["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"入门","minutes":4,"keywords":"LOTO 锁定 挂牌 安全","tag":"技术精读","date":"2026.10.22"},{"id":22,"category":"安全规程","title":"配电柜有电弧风险，只戴绝缘手套够吗？","lead":"电弧闪络与电击并非同一种伤害机制，个人防护选择要基于风险评估，不是简单叠加装备。","points":[["区分风险","电击关注人体触电路径，电弧可能产生高热、压力、飞溅与强光。"],["优先工程控制","减少带电作业、优化保护整定、隔离与设计，比仅依赖 PPE 更根本。"],["专业评估","进入作业前按实际电压、故障电流、切除时间和当地规范识别防护边界。"]],"wrong":"误区：把“戴了手套”当作带电打开所有配电柜门的许可。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"],["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"进阶","minutes":5,"keywords":"电弧闪络 PPE 配电柜","tag":"技术精读","date":"2026.10.22"},{"id":23,"category":"电机与控制","title":"自锁与互锁，区别一句话讲清楚","lead":"自锁让设备保持某个状态；互锁限制冲突动作不能同时发生。两者常出现在正反转控制回路。","points":[["自锁","使用辅助触点维持接触器线圈回路，让按钮松开后线圈仍可保持通电。"],["互锁","通过电气触点或机械结构，阻止两只相互冲突的接触器同时合上。"],["可靠性优先","正反转等高风险控制通常还需机械互锁及适当保护，不能只靠软件逻辑。"]],"wrong":"误区：认为一个常闭辅助触点的电气互锁在任何故障条件下都足够安全。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":5,"keywords":"自锁 互锁 正反转 控制线路","tag":"技术精读","date":"2026.10.22"},{"id":24,"category":"电机与控制","title":"星三角启动是“降功率”还是“降电压”？","lead":"它主要通过改变绕组连接方式降低起动时每相绕组承受的电压，从而减小起动电流与起动转矩。","points":[["适用边界","电机额定绕组电压、供电电压和负载起动特性必须满足要求，不是所有电机都能用。"],["为何转矩变小","同一电源条件下，星形接法绕组相电压较低，起动转矩会明显下降。"],["转换瞬间需要关注","切换逻辑、接触器互锁以及起动负载是否已经接近稳定速度。"]],"wrong":"误区：认为采用星三角一定比直接起动更适合重载起动。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":5,"keywords":"星三角 启动 电机","tag":"技术精读","date":"2026.10.22"},{"id":25,"category":"电机与控制","title":"变频器输出侧，普通万用表读数为什么可能怪？","lead":"PWM 逆变输出不是纯正弦波，不同仪表的带宽、算法和输入滤波导致读数不一致。","points":[["认识波形","电机端得到的是高频开关构成的调制波形，仪表展示的数值取决于其测量方法。"],["选择正确仪器","需要核对仪表是否适合变频驱动输出测量，按制造商说明选功能和接法。"],["安全边界","变频器直流母线可能在断电后仍储有危险能量。"]],"wrong":"误区：把不同量程和测量模式得到的数值直接互相比对并据此判定驱动器损坏。","sources":[["Fluke · Motor Input Troubleshooting","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/how-to-troubleshoot-motors-and-drives-starting-at-the-inputs"],["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"进阶","minutes":6,"keywords":"变频器 PWM 万用表","tag":"技术精读","date":"2026.10.22"},{"id":26,"category":"电机与控制","title":"热继电器与断路器，谁负责什么？","lead":"热继电器常用于电机过载保护；断路器承担其设计范围内的过电流保护，两者不能不加区分地相互替代。","points":[["先理解过载","过载可持续一段时间，热继电器根据电流与时间特性保护电机。"],["再理解短路","短路故障电流往往大得多，需要相应分断能力和故障保护装置。"],["看完整组合","接触器、过载继电器与短路保护器件应按厂家配合方案选型。"]],"wrong":"误区：只安装一个热继电器，就认定短路保护、隔离和控制功能都齐全。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":4,"keywords":"热继电器 断路器 过载","tag":"技术精读","date":"2026.10.22"},{"id":27,"category":"仪表测量","title":"钳形表夹住火线和零线，为什么可能读数接近零？","lead":"钳形表测到的是钳口内导体电流产生磁场的矢量合成结果；去、回电流相互抵消时显示接近零。","points":[["单根导体","测某一支路电流，应按仪表要求夹取相应单根导体。"],["双根同夹","同一完整回路去回电流方向相反，理想情况下净磁场接近零。"],["泄漏电流应用","专用高灵敏度漏电流钳表可通过同时钳取相关有源导体，检测剩余电流。"]],"wrong":"误区：认为同夹两根线读零就一定证明“设备完全没有用电”。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":4,"keywords":"钳形表 火线 零线 漏电","tag":"技术精读","date":"2026.10.22"},{"id":28,"category":"仪表测量","title":"绝缘电阻和普通电阻，为什么不能混着测？","lead":"普通万用表电阻档和绝缘电阻测试仪的测试电压、目的及适用场景并不一样。","points":[["目的不同","绝缘电阻用于检查绝缘系统状态，普通电阻测试多用于导体或元件连接状态检查。"],["电压与设备风险","绝缘测试施加特定直流测试电压，敏感电子设备及电容必须按制造商要求处理。"],["结果需要对照","温度、湿度、测试时长与设备规格影响读数，应结合规定阈值和历史趋势。"]],"wrong":"安全提醒：绝缘测试必须由合格人员按程序隔离、放电并验证；不得对带电线路直接测试。","sources":[["Fluke · Motor Input Troubleshooting","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/how-to-troubleshoot-motors-and-drives-starting-at-the-inputs"],["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"入门","minutes":5,"keywords":"绝缘电阻 兆欧表 万用表","tag":"技术精读","date":"2026.10.22"},{"id":29,"category":"仪表测量","title":"万用表显示 0V，为什么还不能直接摸？","lead":"单次电压读数可能受到档位、表笔、测试点、感应电压与仪表故障影响。","points":[["确认仪表状态","检查测量类别、档位、引线及装置适用性，并按规定验证验电功能。"],["考虑隐藏能源","双电源、储能、UPS 回馈或电容放电等条件可能让部分节点仍带危险电压。"],["执行正式验电程序","应由授权人员根据现场规定在合适位置、使用合适设备验证。"]],"wrong":"误区：把手机视频里的一次 0V 演示作为现场判断无电的通用依据。","sources":[["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"入门","minutes":4,"keywords":"万用表 0V 安全 验电","tag":"技术精读","date":"2026.10.22"},{"id":30,"category":"工程设计","title":"400V 三相负载，快速估算电流用哪个公式？","lead":"已知三相有功功率、电压、功率因数时，常用近似关系 I=P/(√3×U×cosφ)，其中 P 用 W、U 用线电压 V。","points":[["举个例子","30kW、400V、功率因数 0.9：I≈30000/(1.732×400×0.9)≈48.1A。"],["为什么不是选型最终值","电机效率、谐波、起动电流、同时系数及保护整定等不能凭一个式子决定。"],["变频负载额外小心","不同位置的电压、电流波形和功率因数定义可能不同。"]],"wrong":"误区：按 30kW÷220V 来估算三相线电流；还要弄清楚 kW 是输入还是输出功率。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":4,"keywords":"三相 电流 公式 kW","tag":"技术精读","date":"2026.10.22"},{"id":31,"category":"工程设计","title":"负载 30kW，UPS 选 30kVA 就够吗？","lead":"kW 表示有功功率，kVA 表示视在功率，数值大小与负载功率因数和 UPS 额定输出能力有关。","points":[["先分清额定值","同为 30kVA 的 UPS，允许输出的最大 kW 可能因型号而不同。"],["再考虑使用余量","连续负载、未来扩容、环境温度和系统冗余要求都会影响规划。"],["不能忽略旁路及电池","整流输入、旁路、下游配电、储能续航要作为整套系统校核。"]],"wrong":"误区：单凭设备铭牌的一个 kVA 值，就宣布电池续航和上下游线路都满足要求。","sources":[["Eaton · UPS Maintenance Bypass Best Practices","https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/maintenance-bypass-for-ups-redundancy.html"],["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":5,"keywords":"UPS kW kVA 容量","tag":"技术精读","date":"2026.10.22"},{"id":32,"category":"工程设计","title":"配电系统单线图，应该先从哪里读？","lead":"先抓电源、母线、变压器、分段和末端负载五个元素，再看开关、保护、计量和控制关系。","points":[["上游从哪里来","数清市电、柴发、UPS、光伏或储能输入路径。"],["中间怎么分配","看变压器、电压等级、母线分段、母联与各个进出线开关。"],["下游保护谁","沿一条支路追踪至具体设备，核对额定参数与保护协同。"]],"wrong":"误区：只看到两条进线就认为所有负载天然具备无缝转供能力。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"],["Uptime Institute · Tier Classification","https://uptimeinstitute.com/tiers"]],"level":"入门","minutes":5,"keywords":"单线图 配电 母联 电源","tag":"技术精读","date":"2026.10.22"},{"id":33,"category":"工程设计","title":"为什么导线压降不仅是“线太长”？","lead":"电压降受线路长度、材料电阻、电抗、负载电流及功率因数等因素共同决定。","points":[["线路参数","导体材料、截面积、温度和敷设方式影响线路阻抗。"],["负载因素","同样长度的电缆，重载时压降往往比轻载时显著。"],["计算与实测结合","设计阶段做压降校验，运行时可对照首末端电压和电流，注意测量条件一致。"]],"wrong":"误区：认为换粗线是所有末端欠压问题的唯一解法，而不检查接触不良或上游容量。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":5,"keywords":"压降 线缆 长度","tag":"技术精读","date":"2026.10.22"},{"id":34,"category":"故障诊断","title":"PT 二次电压偏低，先别认定一定是熔断器坏了","lead":"一组电压互感器出现异常，应先确认测量基准、仪表回路和一次侧条件，再判断故障落点。","points":[["核对一致性","将 PT 端与仪表端同一电压量及接线关系作对比，排除二次回路额外压降和误接线。"],["验证一次电压信息","比较同母线其他合法测点的示值，同时排查变比设置、接线组别与测量方式。"],["停电后的检验","由高压专业人员按规定验电、接地后核查熔断器、底座、触头、接线及 PT 本体。"]],"wrong":"高压危险：禁止据此开展带电开柜、拔高压保险或跨越安全隔离的测量。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"],["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"]],"level":"进阶","minutes":6,"keywords":"PT 电压互感器 二次电压 保险","tag":"技术精读","date":"2026.10.22"},{"id":35,"category":"安全规程","title":"一个“紧急停机按钮”可以当隔离开关吗？","lead":"急停是降低特定危险状态风险的控制功能，不等于电气隔离和能量锁定。","points":[["控制与隔离不同","急停可能只令控制系统停机，设备仍存在电源或储存能量。"],["检修前查能源","断开隔离装置、锁定、验证零能量，并覆盖其他供电或机械储能来源。"],["设计要整体看","急停、保护电器、隔离开关与工作流程分别解决不同问题。"]],"wrong":"误区：急停灯灭了，就把设备看作可无条件接触的无能量设备。","sources":[["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"],["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":4,"keywords":"急停 LOTO 隔离","tag":"技术精读","date":"2026.10.22"},{"id":36,"category":"电机与控制","title":"电动机铭牌的 380/660V，究竟意味着什么？","lead":"常见的双电压铭牌与绕组额定电压、接线方法有关；必须完整读取厂家标注的 Δ/Y 符号。","points":[["优先读符号","例如标注 380V Δ / 660V Y 的电机，两种连接方式对应同一绕组的额定相电压。"],["匹配电网","不能只看到 660V 就认定可以在 380V 三角形长期星形运行并带满负载。"],["与起动方式相连","是否适用星三角启动要同时核对额定接法、机械负载和控制系统。"]],"wrong":"误区：忽略 Δ/Y 对应关系就随意更换接线片，可能损坏绕组。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":5,"keywords":"电机 铭牌 380 660 星三角","tag":"技术精读","date":"2026.10.22"},{"id":37,"category":"低压配电","title":"SPD 浪涌保护器和漏电保护器，是一种东西吗？","lead":"SPD 主要处理瞬态过电压；RCD 主要监测剩余电流。防雷浪涌与触电故障保护不能互相替代。","points":[["SPD 关注瞬态过压","雷电感应或开关操作可能产生浪涌，SPD 根据系统配置限制相关过电压。"],["RCD 关注剩余电流","回路去回电流不平衡超过装置工作条件时，RCD 可实施保护动作。"],["工程协同","保护配置必须结合供电系统、接地、短路保护及安装位置进行设计。"]],"wrong":"误区：以为装了浪涌保护器就具备漏电保护，或以为装了漏保就无须考虑浪涌。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"入门","minutes":4,"keywords":"SPD RCD 浪涌 漏保","tag":"技术精读","date":"2026.10.22"},{"id":38,"category":"UPS与数据中心","title":"A/B 双路到机柜，为什么仍可能有单点故障？","lead":"两路电源的独立性不仅取决于机柜里有两根线，还涉及上游变压器、UPS、开关与控制等环节。","points":[["从负载回溯","画出每个 IT 设备从电源输入到供电端的完整路径，识别共同节点。"],["单电源设备例外","单电源设备若需要连续运行，可能还需合适的转换或冗余策略。"],["维护验证","系统检修条件下是否仍供电，与正常运行下“双路都亮”不是一回事。"]],"wrong":"误区：机柜里两组插排分别写着 A/B，就断言它们一定来自完全独立的上游路径。","sources":[["Uptime Institute · Tier Classification","https://uptimeinstitute.com/tiers"],["Eaton · UPS Maintenance Bypass Best Practices","https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/maintenance-bypass-for-ups-redundancy.html"]],"level":"进阶","minutes":5,"keywords":"A/B 双路 PDU 单点故障","tag":"技术精读","date":"2026.10.22"},{"id":39,"category":"仪表测量","title":"一次钳表测量，为什么电流数字一直跳？","lead":"负载波动、变频器谐波、夹钳位置、测量模式与仪表采样性能都可能影响显示。","points":[["先看负载类型","电热、压缩机、电机和开关电源的电流波形及运行周期不同。"],["规范测量方式","钳口闭合、导体位置、量程及 RMS 模式是否适合现场工况，要依说明书核对。"],["需要趋势就记录","要判断周期性波动，用具有记录功能的仪器比手工记几个瞬时值更可靠。"]],"wrong":"误区：仪表数字有波动就立刻认定电机故障。","sources":[["Fluke · Motor Input Troubleshooting","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/how-to-troubleshoot-motors-and-drives-starting-at-the-inputs"]],"level":"入门","minutes":4,"keywords":"钳形表 电流 波动","tag":"技术精读","date":"2026.10.22"},{"id":40,"category":"工程设计","title":"保护接地、等电位联结、重复接地，三者别混用","lead":"几个词都与触电防护有关，但作用和实施位置不同，需要先辨清概念再设计。","points":[["保护接地","通过保护导体与接地措施参与故障保护，使保护装置在设计故障条件下发挥作用。"],["等电位联结","将规定的导电部分进行连接，降低可同时触及部分之间的危险电位差。"],["重复接地","发生在特定供电系统与规定部位，不能把任意打接地极都称为合格的重复接地。"]],"wrong":"误区：认为“接地电阻越小，任何系统就越安全”，忽略自动切断和故障回路条件。","sources":[["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"]],"level":"进阶","minutes":6,"keywords":"等电位 保护接地 重复接地","tag":"技术精读","date":"2026.10.22"},{"id":41,"category":"安全规程","title":"储能电池断开交流侧，直流侧就安全了吗？","lead":"不一定。储能及 UPS 电池回路可能独立提供危险直流电压，且电容器还可能保留电荷。","points":[["识别多源风险","交流输入、蓄电池、光伏和内部直流母线可能具有不同的隔离点。"],["按机型管理残能","放电时间、验证位置与断开顺序必须以设备说明及正式作业程序为准。"],["专业措施不可省略","需要具备相应资质的作业人员、正确测试设备和应急措施。"]],"wrong":"误区：关掉机房总空开，就直接触碰 UPS 或储能系统内部母排。","sources":[["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"],["Eaton · UPS Maintenance Bypass Best Practices","https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/maintenance-bypass-for-ups-redundancy.html"]],"level":"进阶","minutes":5,"keywords":"储能 电池 UPS 直流 危险","tag":"技术精读","date":"2026.10.22"}];</script>
<script>
(()=>{'use strict';
const $=x=>document.querySelector(x),app=$('#app'); const groups=['全部','故障诊断','低压配电','UPS与数据中心','电机与控制','仪表测量','安全规程','工程设计'];
const G={ '故障诊断':'TRIP','低压配电':'400V','UPS与数据中心':'UPS','电机与控制':'MOTOR','仪表测量':'TEST','安全规程':'LOTO','工程设计':'CAD' };
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readLocal(key,fallback){try{const a=JSON.parse(localStorage.getItem('dy_'+key));return a??fallback}catch(e){return fallback}}
function setLocal(key,value){try{localStorage.setItem('dy_'+key,JSON.stringify(value))}catch(e){}}
let st={tab:'全部',cat:'全部',query:'',sort:'new',bookmarks:readLocal('bookmarks',[]),read:readLocal('read',[]),theme:readLocal('theme','light'),font:readLocal('font',1),quiz:readLocal('quiz',{})};
const validIds = new Set(DATA.map(a=>a.id)); st.bookmarks=st.bookmarks.filter(id=>validIds.has(id)); st.read=st.read.filter(id=>validIds.has(id));
if(st.theme==='dark')document.documentElement.classList.add('dark');
function nav(){return `<div class="shell"><div class="site-nav"><a href="#/" aria-label="返回首页">2026.10.22 · 首版</a><div class="nav-links"><button class="linkbtn" data-route="tools">工具</button><button class="linkbtn" data-route="quiz">测验</button><button class="linkbtn" data-route="about">关于</button><button class="theme-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">${st.theme==='dark'?'☀':'☾'}</button></div></div></div>`}
function footer(){return `<div class="shell"><footer class="footer"><div><strong style="color:var(--ink)">电工有数 · ELECTRICAL NOTES</strong><br>用看得懂的语言，把电气技术真正讲清楚。</div><div>资料整理日期：2026.10.22<br>原创整理 · 保留公开来源链接 · 不替代现场设计与安全操作程序<br><a href="#/about">编辑说明与使用边界</a></div></footer></div>`}
function row(a){const read=st.read.includes(a.id),saved=st.bookmarks.includes(a.id);return `<article class="article-row"><div class="article-main"><div class="meta"><span class="n">第 ${String(a.id).padStart(3,'0')} 篇</span><span>${a.date}</span><span class="accent">技术精读</span>${read?'<span>· 已读</span>':''}</div><h4><a href="#/article/${a.id}">${safe(a.title)}</a></h4><p class="summary">${safe(a.lead)}</p><div class="tags"><span>${safe(a.category)}</span><span>·</span><span>${a.minutes} 分钟</span><button class="tagbtn ${saved?'is-on':''}" data-bookmark="${a.id}" aria-label="${saved?'取消收藏':'收藏'}">${saved?'★ 已收藏':'☆ 收藏'}</button></div></div><a href="#/article/${a.id}" class="cover" aria-label="阅读 ${safe(a.title)}"><span class="glyph">${safe(G[a.category]||'ELEC')}</span><span class="micro">ELECTRICAL NOTES</span></a></article>`}
function baseHome(){return `${nav()}<div class="shell"><header class="hero"><div class="eyebrow">ELECTRICAL FIELD NOTES</div><h1>电工有数</h1><h2>电气知识全档案</h2><div class="desc"><b>${DATA.length}</b> 篇原创整理 · <b>${groups.length-1}</b> 个专题 · 公开资料可核查</div></header><div class="bold-rule"></div><div class="toolbar"><label class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7.8"/><path d="m17 17 5 5"/></svg><input id="search" type="search" autocomplete="off" placeholder="搜索故障、设备、原理、术语…" value="${safe(st.query)}"><button id="clear" class="clear" title="清空搜索">清空</button></label><nav class="tabstrip" aria-label="阅读筛选"><button data-tab="全部" class="${st.tab==='全部'?'active':''}">全部</button><button data-tab="精读" class="${st.tab==='精读'?'active':''}">技术精读 <span style="font-weight:400;color:var(--muted)">${DATA.length}</span></button><button data-tab="收藏" class="${st.tab==='收藏'?'active':''}">收藏 ${st.bookmarks.length}</button><button data-tab="已读" class="${st.tab==='已读'?'active':''}">已读 ${st.read.length}</button></nav></div><div id="homeContent"></div></div>${footer()}`}
function renderHome(){app.innerHTML=baseHome();const i=$('#search');i.addEventListener('input',e=>{st.query=e.target.value;updateList()});$('#clear').addEventListener('click',()=>{st.query='';i.value='';i.focus();updateList()});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{st.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));updateList()}));updateList();bindGlobal()}
function updateList(){let arr=DATA.filter(a=>(st.cat==='全部'||st.cat===a.category)&&(st.tab!=='收藏'||st.bookmarks.includes(a.id))&&(st.tab!=='已读'||st.read.includes(a.id)));const q=st.query.trim().toLowerCase();if(q)arr=arr.filter(a=>[a.title,a.lead,a.category,a.keywords,...a.points.flat()].join(' ').toLowerCase().includes(q));if(st.sort==='old')arr=arr.slice().reverse();const place=$('#homeContent');if(!place)return;const feat=st.tab==='全部'&&st.cat==='全部'&&!q?`<div class="feature"><div class="featured"><div><div class="label">✦ 编辑精选 · 故障诊断</div><h3><a href="#/article/1">三相电压正常，<br>电机为什么还会发热？</a></h3></div><p>一次把电压、电流、接触电阻和机械负载的排查顺序讲明白。 →</p></div><a href="#/tools" class="feature-card"><small>FREE · 实用工具</small><strong>不平衡率与<br>三相电流计算</strong><span>快速计算，辅助理解。进入工具箱 ↗</span></a></div>`:'';place.innerHTML=`${feat}<main class="section-pad"><div class="split-title"><h3>${st.tab==='收藏'?'我的收藏':st.tab==='已读'?'阅读记录':q?'搜索结果':'中文精读'} <span class="subtle">${arr.length} 篇</span></h3><button class="sort" id="sortBtn">${st.sort==='new'?'最新排序 ↓':'最早排序 ↑'}</button></div><nav class="filterline" aria-label="知识分类">${groups.map(g=>`<button data-cat="${g}" class="${st.cat===g?'active':''}">${g}</button>`).join('')}</nav><div id="results">${arr.map(row).join('')||'<div class="empty"><strong>没有匹配内容</strong>换个关键词，或调整筛选条件。</div>'}</div></main>`;$('#sortBtn').addEventListener('click',()=>{st.sort=st.sort==='new'?'old':'new';updateList()});document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{st.cat=b.dataset.cat;updateList()}));document.querySelectorAll('[data-bookmark]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.bookmark);toggleSave(id);updateList()}))}
function toggleSave(id){st.bookmarks=st.bookmarks.includes(id)?st.bookmarks.filter(x=>x!==id):[...st.bookmarks,id];setLocal('bookmarks',st.bookmarks)}
function renderArticle(id){const a=DATA.find(x=>x.id===id);if(!a){location.hash='#/';return;}if(!st.read.includes(id)){st.read.push(id);setLocal('read',st.read)}const saved=st.bookmarks.includes(id);document.title=a.title+' · 电工有数';app.innerHTML=`${nav()}<div class="shell"><main class="article-view"><a class="back" href="#/">← 返回全部文章</a><div class="meta"><span class="n">第 ${String(id).padStart(3,'0')} 篇</span><span>${safe(a.category)}</span><span class="accent">技术精读</span><span>${a.minutes} 分钟</span></div><h1>${safe(a.title)}</h1><div class="dark-rule"></div><div class="reading-tools"><span>${safe(a.level)} · 编辑整理于 2026 年 10 月 22 日</span><div><button id="saveArt">${saved?'★ 已收藏':'☆ 收藏文章'}</button> <button id="fontArt">字号 A${st.font===1?'':'+'}</button> <button id="shareArt">分享 ↗</button></div></div><p class="lede">${safe(a.lead)}</p>${a.points.map((p,i)=>`<section class="paper-section"><h2>${i+1}. ${safe(p[0])}</h2><p>${safe(p[1])}</p></section>`).join('')}<div class="warn"><strong>特别提醒 / 常见误区</strong><div>${safe(a.wrong)}</div></div><div class="refs"><strong style="color:var(--ink)">参考资料与延伸阅读</strong><br>${a.sources.map(s=>`<a target="_blank" rel="noopener noreferrer" href="${safe(s[1])}">↗ ${safe(s[0])}</a>`).join('<br>')}</div><p class="note">本文为独立原创整理，不是制造商授权译文；相关外文资料仅用于事实核查与延伸阅读。现场操作、计算与设备选型须遵循适用法律法规、标准、设备手册及专业审批流程。</p><div class="shortcuts"><a class="pill" href="#/">← 浏览目录</a><a class="pill" href="#/tools">打开计算器 ↗</a></div></main></div>${footer()}`;$('.article-view').style.fontSize=st.font===2?'1.1em':'1em';$('#saveArt').addEventListener('click',()=>{toggleSave(id);$('#saveArt').textContent=st.bookmarks.includes(id)?'★ 已收藏':'☆ 收藏文章'});$('#fontArt').addEventListener('click',()=>{st.font=st.font===1?2:1;setLocal('font',st.font);$('.article-view').querySelectorAll('.paper-section p').forEach(p=>p.style.fontSize=st.font===1?'16px':'19px');$('#fontArt').textContent=st.font===1?'字号 A':'字号 A+'});$('#shareArt').addEventListener('click',()=>{const url=location.href; if(navigator.share){navigator.share({title:a.title,url}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>toast('文章链接已复制')).catch(()=>toast('请复制浏览器地址'))}else toast('请复制浏览器地址')});bindGlobal();updateProgress()}
function input(name, val,unit){return `<label class="calc-cell"><span>${name} ${unit?`(${unit})`:''}</span><input type="number" step="any" data-field="${name}" value="${val}" inputmode="decimal"></label>`}
function renderTools(){document.title='电气计算器 · 电工有数';app.innerHTML=`${nav()}<div class="shell"><div class="special-shell"><a class="back" href="#/">← 返回知识库</a><h1>电气计算工具</h1><p>三相电流和电压不平衡率，做成真正可以输入数值的交互计算器。结果用于学习与初步估算，不代替工程设计。</p><section class="calc-block" id="amps"><h2>01 / 三相有功负载电流估算</h2><p>I = P / (√3 × U × cosφ)。功率填电气输入有功功率，非机械输出功率。</p><div class="calculator">${input('有功功率',30,'kW')}${input('线电压',400,'V')}${input('功率因数',0.9,'cosφ')}</div><div class="result"><div class="subtle">估算线电流</div><div class="value" id="ampVal">— A</div><div class="explain" id="ampExp"></div></div></section><section class="calc-block" id="balance"><h2>02 / 三相电压不平衡率</h2><p>最大相对偏差 ÷ 三相平均值 × 100%，按 Fluke 的定义计算。</p><div class="calculator">${input('AB电压',380,'V')}${input('BC电压',390,'V')}${input('CA电压',400,'V')}</div><div class="result"><div class="subtle">电压不平衡率</div><div class="value" id="balVal">— %</div><div class="explain" id="balExp"></div></div></section><div class="refs">参考：<a href="https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/voltage-unbalance" target="_blank" rel="noopener noreferrer">Fluke 电压不平衡计算说明</a>；<a href="https://www.electrical-installation.org/enwiki/Main_Page" target="_blank" rel="noopener noreferrer">施耐德电气 Electrical Installation Guide</a></div></div></div>${footer()}`;const vals=(sel)=>Number(document.querySelector(`[data-field="${sel}"]`).value);function cal(){let p=vals('有功功率'),u=vals('线电压'),f=vals('功率因数');let valid=p>=0&&u>0&&f>0&&f<=1;$('#ampVal').textContent=valid?(1000*p/(Math.sqrt(3)*u*f)).toFixed(1)+' A':'输入有误';$('#ampExp').textContent=valid?`${p}kW ÷ (√3 × ${u}V × ${f})；未计效率、谐波、启动电流及设计裕量。`:'检查电压 > 0、功率因数在 (0,1] 内。';const a=[vals('AB电压'),vals('BC电压'),vals('CA电压')],avg=a.reduce((x,y)=>x+y,0)/3,mx=Math.max(...a.map(v=>Math.abs(v-avg)));$('#balVal').textContent=avg>0&&a.every(v=>v>0)?(mx/avg*100).toFixed(2)+' %':'输入有误';$('#balExp').textContent=avg>0&&a.every(v=>v>0)?`平均值 ${avg.toFixed(1)} V，最大偏差 ${mx.toFixed(1)} V。此数值不是故障判定的唯一依据。`:'三项电压均需大于 0。'}document.querySelectorAll('.calculator input').forEach(i=>i.addEventListener('input',cal));cal();bindGlobal()}
const quiz=[['配电箱一个末端支路短路，理想的选择性保护希望谁先动作？',['整栋建筑总断路器','最接近故障点的保护器件','UPS 电池'],'1','选择性保护希望尽量只切除故障回路。'],['电压不平衡率常用哪种计算方式？',['最大偏差÷三相平均值×100%','最大值÷最小值×100%','三相电压求和×100%'],'0','Fluke 采用相对平均值最大偏差的定义。'],['UPS 的静态旁路是否等于完成维修隔离？',['是','不是','只要机房没有负载就是'],'1','旁路转换不意味着可以跳过设备隔离与验证。'],['带电设备停机后准备检修，应重点注意什么？',['只看开关灯是否熄灭','按能源隔离与零能量验证程序执行','多按几次急停按钮'],'1','机械、直流及储能等危险能源可能仍存在。'],['以下哪项通常属于剩余电流保护器 RCD 的主要监测对象？',['剩余电流','雷击产生的瞬态过电压','线路的有功功率'],'0','SPD 与 RCD 对应不同风险。'],['数据中心 Tier III 的重要特征是什么？',['只要有两台 UPS','基础设施并发可维护性','所有设备永远不会故障'],'1','Tier III 不是“零故障”的承诺。']];
function renderQuiz(){document.title='电工自测 · 电工有数';app.innerHTML=`${nav()}<div class="shell"><main class="special-shell"><a class="back" href="#/">← 返回知识库</a><h1>5 分钟知识自测</h1><p>6 道短题，用来检测是否真正理解关键概念。选择后立即显示解释，答案仅保存在本机。</p><div id="quizlist">${quiz.map((a,i)=>`<section class="quiz" data-quiz="${i}"><div class="meta"><span class="n">问题 ${String(i+1).padStart(2,'0')}</span> · 基础与安全</div><h3>${safe(a[0])}</h3>${a[1].map((x,j)=>`<button class="option" data-q="${i}" data-a="${j}">${String.fromCharCode(65+j)}. ${safe(x)}</button>`).join('')}<div class="expl" id="ans${i}"></div></section>`).join('')}</div><div class="result" id="quizScore"></div></main></div>${footer()}`;function answer(i,j){st.quiz[i]=j;setLocal('quiz',st.quiz);paintQuiz()}function paintQuiz(){quiz.forEach((a,i)=>{const chosen=st.quiz[i];document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{const j=Number(b.dataset.a);b.classList.toggle('correct',chosen!==undefined&&String(j)===a[2]);b.classList.toggle('incorrect',chosen!==undefined&&chosen===j&&String(j)!==a[2]);b.disabled=chosen!==undefined});$('#ans'+i).textContent=chosen===undefined?'':(String(chosen)===a[2]?'✓ 回答正确。':'✗ 正确答案：'+String.fromCharCode(65+Number(a[2]))+'。')+a[3]});const count=Object.keys(st.quiz).filter(i=>Number(i)<quiz.length).length,score=quiz.reduce((n,a,i)=>n+(String(st.quiz[i])===a[2]?1:0),0);$('#quizScore').innerHTML=`<strong>已完成 ${count} / ${quiz.length} 题 · 正确 ${score} 题</strong><div class="shortcuts"><button class="pill" id="restartQuiz">重新测试</button><a class="pill" href="#/">回到目录</a></div>`;$('#restartQuiz').addEventListener('click',()=>{st.quiz={};setLocal('quiz',{});renderQuiz()})}document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.q),Number(b.dataset.a))));paintQuiz();bindGlobal()}
function renderAbout(){document.title='关于电工有数';app.innerHTML=`${nav()}<div class="shell"><main class="special-shell"><a class="back" href="#/">← 返回知识库</a><h1>关于这个知识库</h1><p>电工有数是一个面向电气运行、维护、培训和入门学习的公开知识站。借鉴 Lex Fridman 中文精读站简洁的目录与阅读体验，但文章、分类和交互功能均为重新制作。</p><div class="aboutblock"><h2>这版提供什么？</h2><p>${DATA.length} 篇电工原创整理，覆盖故障诊断、低压配电、UPS 与数据中心、电机与控制、仪表测量、安全规程、工程设计。全部内容可搜索、收藏、记录已读，附有可实际运算的计算器和入门自测。</p></div><div class="aboutblock"><h2>数据从哪里来？</h2><p>知识条目依据施耐德电气 Electrical Installation Guide、Fluke 技术资料、Eaton 公开说明、Uptime Institute 分级资料与 OSHA 安全指导独立撰写。每篇页面列出可打开的公开参考网址。公开资料只作为学习线索，不代表对原文、图片或标准全文取得再分发授权。</p></div><div class="aboutblock"><h2>内容会每天自动更新吗？</h2><p><strong>当前版本不会。</strong> 这是一份包含初始内容的静态知识站，可以部署为公开网址；但无人值守的每日更新需要额外部署定时任务、数据采集、审核与自动发布流程。页面不会伪装“今日自动同步”。</p></div><div class="aboutblock"><h2>隐私与安全</h2><p>本版本不要求注册，也不收集个人身份信息。书签、阅读历史和测验结果只存储于当前浏览器的本地储存。所有专业技术内容仅供教学理解，不替代制造商说明、适用标准、现场作业票据或安全措施；任何高低压作业应由相应资质人员执行。</p></div><div class="aboutblock"><h2>参考资料入口</h2>${Object.values({"schneider":["施耐德电气 · Electrical Installation Guide","https://www.electrical-installation.org/enwiki/Main_Page"],"fluke":["Fluke · Voltage Unbalance","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/voltage-unbalance"],"fluke_motor":["Fluke · Motor Input Troubleshooting","https://www.fluke.com/en-us/learn/blog/motors-drives-pumps-compressors/how-to-troubleshoot-motors-and-drives-starting-at-the-inputs"],"eaton":["Eaton · UPS Maintenance Bypass Best Practices","https://www.eaton.com/us/en-us/products/backup-power-ups-surge-it-power-distribution/backup-power-ups/maintenance-bypass-for-ups-redundancy.html"],"osha":["OSHA · Control of Hazardous Energy","https://www.osha.gov/control-hazardous-energy/"],"uptime":["Uptime Institute · Tier Classification","https://uptimeinstitute.com/tiers"]}).map(s=>`<p><a href="${safe(s[1])}" target="_blank" rel="noopener noreferrer">↗ ${safe(s[0])}</a></p>`).join('')}</div></main></div>${footer()}`;bindGlobal()}
function bindGlobal(){const b=$('#themeBtn');if(b)b.addEventListener('click',()=>{st.theme=st.theme==='dark'?'light':'dark';document.documentElement.classList.toggle('dark',st.theme==='dark');setLocal('theme',st.theme);b.textContent=st.theme==='dark'?'☀':'☾'});document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>location.hash='#/'+b.dataset.route))}
function router(){document.title='电工有数 · 电气知识全档案';const hash=decodeURI(location.hash).replace(/^#\/?/,'').split('/').filter(Boolean);const [page,arg]=hash;window.scrollTo(0,0);$('#progressLine').style.width='0%';if(page==='article')renderArticle(Number(arg));else if(page==='tools')renderTools();else if(page==='quiz')renderQuiz();else if(page==='about')renderAbout();else renderHome()}
function updateProgress(){if(!location.hash.includes('/article/'))return;const el=$('.article-view');if(!el)return;const max=el.offsetTop+el.offsetHeight-window.innerHeight;const pct=max>0?Math.max(0,Math.min(100,window.scrollY/max*100)):100;$('#progressLine').style.width=pct+'%'}
let toastEl;function toast(t){if(toastEl)toastEl.remove();toastEl=document.createElement('div');toastEl.textContent=t;Object.assign(toastEl.style,{position:'fixed',bottom:'24px',left:'50%',transform:'translateX(-50%)',background:'var(--ink)',color:'var(--bg)',padding:'12px 18px',zIndex:'90',fontSize:'13px'});document.body.appendChild(toastEl);setTimeout(()=>{toastEl?.remove();toastEl=null},2300)}
window.addEventListener('hashchange',router);window.addEventListener('scroll',updateProgress,{passive:true});router();
})();
