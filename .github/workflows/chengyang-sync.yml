name: Sync Chengyang public video index
on:
  schedule:
    - cron: '18 4 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chengyang-video-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public metadata without downloading videos
        env:
          BILI_UID: '1985127693'
          BILI_MAX_PAGES: '100'
          BILI_DELAY_SECONDS: '1.6'
        run: python3 chengyang/sync_bilibili.py
      - name: Commit index only if changed
        run: |
          if git diff --quiet -- chengyang/videos.json; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chengyang/videos.json
          git commit -m 'Update Chengyang public video index'
          git push
