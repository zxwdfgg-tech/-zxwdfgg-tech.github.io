name: Publish public websites

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '20,50 12 * * *'
    - cron: '10,25,45 6 * * *'  # Beijing 14:10, 14:25, 14:45 – catch new daily editions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore picture book assets
        id: books-cache
        uses: actions/cache@v4
        with:
          path: book-cache
          key: public-picture-books-2026-09-14-v1

      - name: Download the complete picture book site
        if: steps.books-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://xiaoya-story-garden.zxwdfgg.chatgpt.site"
          mkdir -p book-cache/art book-cache/audio
          for file in index.html styles.css app.js books.js narrator.js; do
            curl -A "Mozilla/5.0" --retry 4 --retry-all-errors --connect-timeout 20 -fsSL "$base/$file" -o "book-cache/$file"
          done

          ids=(
            01_turnip 02_pigs 03_race 04_hen 05_lion
            06_crow 07_wind 08_duckling 09_monkeys 10_gudong
            11_share 12_puddle 13_cloud 14_sleep 15_tidy
            16_dino 17_car 18_moon 19_seed 20_elephant
          )

          for id in "${ids[@]}"; do
            pages=4
            if [[ "$id" == "01_turnip" ]]; then pages=12; fi
            mkdir -p "book-cache/audio/$id"
            for page in $(seq 1 "$pages"); do
              curl -A "Mozilla/5.0" --retry 4 --retry-all-errors --connect-timeout 20 -fsSL "$base/art/${id}_${page}.webp" -o "book-cache/art/${id}_${page}.webp"
              for language in zh en; do
                for line in 1 2 3; do
                  target="book-cache/audio/$id/p${page}_${language}_${line}.mp3"
                  curl -A "Mozilla/5.0" --retry 2 --retry-all-errors --connect-timeout 20 -fsSL                     "$base/audio/$id/p${page}_${language}_${line}.mp3"                     -o "$target" || rm -f "$target"
                done
              done
            done
          done

          curl -A "Mozilla/5.0" --retry 4 --retry-all-errors --connect-timeout 20 -fsSL "$base/art/01_turnip_cover.webp" -o book-cache/art/01_turnip_cover.webp
          touch book-cache/.nojekyll

          while IFS= read -r -d '' audio_file; do
            mime_type="$(file -b --mime-type "$audio_file")"
            if [[ "$mime_type" != audio/* ]]; then
              rm -f "$audio_file"
            fi
          done < <(find book-cache/audio -type f -name '*.mp3' -print0)

          image_count="$(find book-cache/art -type f -name '*.webp' | wc -l)"
          audio_count="$(find book-cache/audio -type f -name '*.mp3' | wc -l)"
          echo "Validated $image_count illustrations and $audio_count narration clips."

          grep -q "小芽绘本馆" book-cache/index.html
          node --check book-cache/app.js
          node --check book-cache/books.js
          node --check book-cache/narrator.js
          test "$image_count" -eq 89
          test "$audio_count" -eq 351
          file book-cache/art/01_turnip_1.webp | grep -q "Web/P"
          file book-cache/audio/01_turnip/p1_zh_1.mp3 | grep -qi "audio"

      - name: Prepare picture book publication
        run: |
          mkdir -p site
          cp -R book-cache/. site/

      - name: Restore daily infographic assets
        uses: actions/cache@v4
        with:
          path: daily-cache
          key: daily-infographics-v2-${{ github.run_id }}
          restore-keys: daily-infographics-v2-

      - name: Install image optimization dependency
        run: python -m pip install 'Pillow==11.3.0'

      - name: Validate paired daily publication rules
        run: python scripts/test-edition-pair.py

      - name: Build the public daily infographic website
        run: |
          # Verify the reader fixes before publication. Never report a stale mirror as a successful update.
          node --check dc-daily/app-fast.js
          node --check dc-daily/sw.js
          python scripts/test-reader-build.py
          python scripts/mirror-daily.py daily-cache
          # Publish only full-quality original infographics; never synthesize text-card replacements.
          python scripts/validate-daily.py daily-cache
          node --check daily-cache/app.js
          mkdir -p site/dc-daily
          cp -R daily-cache/. site/dc-daily/

      - name: Add encrypted data center training site
        run: |
          mkdir -p site/datacenter
          cp -R datacenter/. site/datacenter/

      - name: Add public electrical workbench
        run: |
          node --check electric-lab/app.js
          node --check electric-lab/engine.js
          node --check electric-lab/router.js
          mkdir -p site/electric-lab
          cp -R electric-lab/. site/electric-lab/

      - name: Include overseas guide in public site
        run: |
          mkdir -p site/overseas
          cp -R overseas/. site/overseas/
          test -s site/overseas/index.html
          grep -q 'ydncg2024' site/overseas/index.html

      - name: Include branded panel practice site
        run: |
          test -s peipan-trainer/index.html
          node --check peipan-trainer/js/app.js
          mkdir -p site/peipan-trainer
          cp -R peipan-trainer/. site/peipan-trainer/

      - name: Include bilingual economy magazine
        run: |
          test -s economy-atlas/index.html
          mkdir -p site/economy-atlas
          cp -R economy-atlas/. site/economy-atlas/
          test -s site/economy-atlas/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published daily content and both images
        run: python scripts/verify-live-daily.py

